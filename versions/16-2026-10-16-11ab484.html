      (state) => {
        const history = snapshot ? [snapshot, ...state.planHistory] : [...state.planHistory];
        return {
          ...state,
          officialPlan: { ...candidate, version: candidate.version },
          planHistory: history.slice(0, historyLimit),
          pendingPreview: null,
          meta: { ...state.meta, lastPlanMutation: { at: nowIso(), summary: changeSummary, trigger } },
        };
      },
      { reason: 'plan-apply' },
    );
    if (!commitResult.ok) return { ok: false, error: commitResult.error };

    return { ok: true, plan: getOfficialPlan(), snapshotCreated: Boolean(snapshot) };
  }

  /**
   * 撤销上一次应用：恢复上一个历史快照。
   *
   * 注意两点有意为之的行为：
   * 1. 版本号**继续递增**，不重用回退的数字。否则"v7 撤回到 v6，然后又改了数据变成 v7"
   *    会让版本号指向两份不同的计划，破坏"预览过期检测"与用户对版本号的信赖。
   * 2. 撤销被拒绝的情形：本次撤销会覆盖用户新完成的学习记录时（即快照之后又有新的已完成时段）。
   */
  function undoLastApply() {
    const current = getOfficialPlan();
    const [latest, ...rest] = getHistory();
    if (!current || !latest) {
      return { ok: false, issues: [error(C.REQUIRED, 'planHistory', '没有可以撤销的计划版本。', {})] };
    }

    const sessions = app.getState().sessions ?? [];
    const restoredIds = new Set(latest.plan?.sessionIds ?? []);
    const newlyCompleted = sessions.filter((s) => s.state === SESSION_STATE.COMPLETED && !restoredIds.has(s.id));
    if (newlyCompleted.length > 0) {
      return {
        ok: false,
        issues: [
          error(
            C.ENTITY_DANGLING_REF,
            'planHistory',
            `无法撤销：撤销后会让 ${newlyCompleted.length} 个已完成的学习记录从计划中消失。请先处理这些记录（或不要撤销）。`,
            { sessionIds: newlyCompleted.map((s) => s.id) },
          ),
        ],
      };
    }

    const restored = { ...latest.plan, version: current.version + 1, generatedAt: nowIso() };
    const commitResult = app.commit(
      (state) => ({
        ...state,
        officialPlan: restored,
        planHistory: rest,
        pendingPreview: null,
        meta: { ...state.meta, lastPlanMutation: { at: nowIso(), summary: `撤销到 v${latest.version}`, trigger: 'undo' } },
      }),
      { reason: 'plan-undo' },
    );
    if (!commitResult.ok) return { ok: false, error: commitResult.error };

    return { ok: true, plan: restored, undoneFrom: current.version, restoredFrom: latest.version };
  }

  /** 版本历史视图（不含完整快照，减小内存与渲染开销） */
  function listVersions() {
    const current = getOfficialPlan();
    return [
      ...(current ? [{ version: current.version, createdAt: current.generatedAt, summary: '当前正式计划', trigger: 'current', current: true }] : []),
      ...getHistory().map((h) => ({
        version: h.version,
        createdAt: h.createdAt,
        summary: h.changeSummary,
        trigger: h.trigger,
        current: false,
      })),
    ];
  }

  /** 计划尚未建立时，给出一个空的展示占位（不是"假计划"，所有统计为 0） */
  function ensureDisplayPlan(windowStart) {
    const current = getOfficialPlan();
    if (current) return current;
    return createEmptyPlan({
      planId: idFactory.next('plan'),
      version: 0,
      windowStart,
      nowIso: nowIso(),
    });
  }

  /** 删除本地历史版本（用于释放存储空间；不影响当前正式计划与任何时段） */
  function clearHistory() {
    const commitResult = app.commit((state) => ({ ...state, planHistory: [] }), { reason: 'plan-history-clear' });
    if (!commitResult.ok) return { ok: false, error: commitResult.error };
    return { ok: true };
  }

  /**
   * 判断某个时段是否受保护（不可被自动排程改动）。
   * 供界面显示锁定图标、以及引擎构建保留集合时使用。
   */
  function isSessionProtected(session) {
    return isLockedForScheduling(session);
  }

  /** 计划是否包含未安排任务（界面用于提示"部分可行"的原因） */
  function unscheduledSummary(plan) {
    const list = plan?.unscheduled ?? [];
    return {
      count: list.length,
      totalMinutes: list.reduce((sum, u) => sum + (u.remainingMinutes ?? 0), 0),
      reasons: [...new Set(list.map((u) => u.reasonCode))],
    };
  }

  /**
   * 生成候选计划与差异预览（**不修改任何已保存的数据**）。
   *
   * @param {object} input
   * @param {{date: string, minutes: number}} input.now 当前本地墙上时间（由调用方注入，保证可测）
   * @param {Map<string, object>} [input.draft] 由 services 层构造的"变更后的草稿状态"
   *   （任务/设置编辑会传入；不传则使用当前状态）
   * @param {string} [input.changeSummary] 变更摘要（写入版本历史）
   * @param {string} [input.trigger] 触发来源
   * @returns {{ok: boolean, preview?: object, issues?: object[], code?: string, result?: object}}
   */
  function requestPreview(input = {}) {
    // "现在"必须显式传入（引擎是纯函数）。未传时从状态容器的时钟推导，便于界面直接调用。
    const now = input.now ?? wallTimeFromDateObject(new Date(app.clock()));
    const baseState = app.getState();

    /**
     * 变更来源有两种：
     * - `ops`：数据变更描述（界面统一走这条路），在内存里应用成草稿状态；
     * - `draft`：调用方直接给出完整草稿状态（引擎测试与内部调用使用）。
     * 无论哪种，**都不会修改已保存的数据**。
     */
    const ops = input.ops ?? [];
    let state = input.draft ?? baseState;
    let windowStart = input.windowStart ?? now.date;
    let draftCreatedTaskIds = [];
    if (ops.length > 0) {
      const baseTaskIds = new Set((baseState.tasks ?? []).map((task) => task.id));
      const applied = applyDraftOps(baseState, ops, { idFactory, nowIso: nowIso() });
      if (!applied.ok) {
        return { ok: false, code: 'invalid_draft', status: 'invalid_input', issues: applied.issues ?? [], diagnostics: [] };
      }
      state = applied.state;
      // 记录草稿阶段"新建任务"的 ID：确认应用时会用同一顺序的新 ID 覆盖它们
      draftCreatedTaskIds = (state.tasks ?? []).filter((task) => !baseTaskIds.has(task.id)).map((task) => task.id);
      const shift = ops.find((op) => op.kind === 'window.shift');
      if (shift?.windowStart) windowStart = shift.windowStart;
    }

    const current = getOfficialPlan();
    const baseVersion = current?.version ?? 0;
    // 基准指纹取**当前状态**的指纹（而不是旧计划里存的指纹）：
    // 这样"预览生成后数据又被改动"就能被精确检测出来。
    const baseInputHash = computeLiveInputHash(app.getState(), now);

    const windowDays = input.windowDays ?? 7;
    const engineResult = runScheduler({
      state,
      now,
      windowStart,
      windowDays,
      existingPlan: current,
      baseVersion: baseVersion + 1,
      planId: idFactory.next('plan'),
    });

    if (!engineResult.ok) {
      return {
        ok: false,
        code: engineResult.reason ?? 'engine_failed',
        status: engineResult.status,
        issues: engineResult.issues ?? [],
        diagnostics: engineResult.diagnostics ?? [],
        unscheduled: engineResult.unscheduled ?? [],
        result: engineResult,
      };
    }

    // 对齐会话身份后再计算差异与快照，保证"没变的安排"在各处都表现为没变
    const alignedPlan = alignCandidateSessionIds(engineResult.plan, state);
    const candidate = { ...alignedPlan, generatedAt: nowIso() };
    const summary = input.changeSummary ?? describeDraftOps(ops);
    const preview = {
      previewId: idFactory.next('preview'),
      baseVersion,
      baseInputHash,
      candidate,
      diff: diffPlans(current, candidate, { taskById: engineResult.taskById ?? buildTaskMap(state) }),
      risks: engineResult.risks,
      diagnostics: engineResult.diagnostics,
      unscheduled: engineResult.unscheduled,
      createdAt: nowIso(),
      changeSummary: summary,
      trigger: input.trigger ?? 'preview',
      /**
       * 应用时需要一并写入的数据变更（确认之前一直只是草稿）。
       *
       * 注意：这里**不预先构造** sessionPlan。
       * 原因：草稿里新任务使用的是"临时实体"（在内存里创建、ID 由同一批操作生成），
       * 与确认时真正写入的任务之间必须保持一致；因此会话快照必须在
       * **重放 ops 之后**、基于最终状态构造（见 applyPreview）。
       */
      ops,
      /** 草稿阶段新建任务的临时 ID（应用时按同一顺序映射为真实 ID） */
      draftCreatedTaskIds,
    };

    const commitResult = app.commit((currentState) => ({ ...currentState, pendingPreview: preview }), { reason: 'preview-create' });
    if (!commitResult.ok) return { ok: false, error: commitResult.error, issues: [] };

    return { ok: true, preview, result: engineResult };
  }

  /**
   * 应用待确认的候选计划。
   *
   * 事务顺序（任一步失败都会保持现有数据不变）：
   *   1. 过期检测（基础版本 + 输入指纹）
   *   2. 结构校验 + 硬约束复检（防止预览生成后数据又变了）
   *   3. 受保护时段必须原样保留（H9 / H10）
   *   4. 一次性写入：正式计划 + 版本快照 + 时段同步
   */
  function applyPreview(input = {}) {
    const preview = getPendingPreview();
    if (!preview) {
      return { ok: false, issues: [error(C.REQUIRED, 'preview', '当前没有待确认的候选计划，无法应用。', {})] };
    }

    const current = getOfficialPlan();
    const currentVersion = current?.version ?? 0;

    if (preview.baseVersion !== currentVersion) {
      return stalePreview('基础版本已变化', preview.baseVersion, currentVersion);
    }

    // 过期检测的第二道关：**重新计算当前状态的输入指纹**，与预览记录的指纹比对。
    // 只比较 officialPlan.inputHash 是不够的——用户在预览生成后修改了任务（例如改截止时间）
    // 但还没有重新生成计划时，officialPlan 上存着的仍是旧指纹，会让过期预览"看起来有效"。
    const liveInputHash = computeLiveInputHash(app.getState(), input.now ?? null);
    if (preview.baseInputHash !== liveInputHash) {
      return stalePreview('生成预览后任务或设置发生了变化', preview.baseInputHash, liveInputHash);
    }

    const validation = validatePlan(preview.candidate, 'candidate');
    if (!validation.ok) return { ok: false, issues: validation.issues };

    const state = app.getState();

    // 重放草稿变更：这是"确认后写入"的关键一步。失败即整体放弃，绝不留半应用状态。
    const replayed = applyDraftOps(state, preview.ops ?? [], { idFactory, nowIso: nowIso() });
    if (!replayed.ok) {
      return {
        ok: false,
        code: 'draft_replay_failed',
        issues: [
          error(C.MIGRATION_FAILED, 'preview.ops', `无法应用候选计划中的数据变更：${replayed.issues?.[0]?.message ?? '未知原因'}`, {}),
          ...(replayed.issues ?? []),
        ],
      };
    }
    const nextState = replayed.state;

    // 草稿阶段新建的任务在"应用"时会再次创建（ID 与草稿不同）。
    // 候选计划里的 taskId 指向草稿 ID，必须按同一顺序改写为真实 ID，
    // 否则确认后会写出"引用不存在的任务"的时段（这是真实发生过的缺陷）。
    const remappedCandidate = remapDraftTaskIds(preview.candidate, state, nextState, preview.draftCreatedTaskIds);

    // 把候选计划的学习片段转换成 StudySession —— **必须基于重放后的状态**，
    // 否则新增任务时产生的时段会引用草稿里的临时任务 ID，导致"时段引用了不存在的任务"。
    const sessionPlan = buildSessionPlan(remappedCandidate, nextState);
    const protectedIssue = checkProtectedSessions(sessionPlan, state.sessions ?? []);
    if (protectedIssue) return { ok: false, issues: [protectedIssue] };

    const snapshot = current ? createPlanSnapshot({ plan: current, nowIso: nowIso(), changeSummary: lastMutationSummary(current), trigger: preview.trigger }) : null;

    const commitResult = app.commit(
      () => {
        const history = snapshot ? [snapshot, ...nextState.planHistory] : [...nextState.planHistory];
        return {
          ...nextState,
          sessions: sessionPlan,
          officialPlan: { ...remappedCandidate, version: remappedCandidate.version },
          planHistory: history.slice(0, historyLimit),
          pendingPreview: null,
          meta: {
            ...nextState.meta,
            lastPlanMutation: { at: nowIso(), summary: preview.changeSummary ?? '应用计划', trigger: preview.trigger ?? 'preview-confirm' },
            initialWindowStart: preview.candidate.windowStart,
          },
        };
      },
      { reason: 'plan-apply-preview' },
    );
    if (!commitResult.ok) return { ok: false, error: commitResult.error, issues: [] };

    return { ok: true, plan: getOfficialPlan(), applied: preview };
  }

  /**
   * 执行清理操作（清理已取消的历史时段、裁剪版本快照）。
   *
   * 这是**用户显式触发**的破坏性操作，因此：
   * - 绝不自动执行，也绝不在没有确认弹窗的情况下调用；
   * - 只清理"已取消且从未开始过"的时段与超出保留上限的旧快照；
   * - 已完成的学习记录与当前正式计划永远不在清理范围内。
   */
  function applyCleanup(ops) {
    const state = app.getState();
    const applied = applyDraftOps(state, ops, { idFactory, nowIso: nowIso() });
    if (!applied.ok) return { ok: false, issues: applied.issues ?? [] };

    const commitResult = app.commit(() => applied.state, { reason: 'cleanup' });
    if (!commitResult.ok) return { ok: false, error: commitResult.error, issues: [] };

    return {
      ok: true,
      removedCount: applied.removedCount ?? 0,
      removedMinutes: applied.removedMinutes ?? 0,
      plan: getOfficialPlan(),
    };
  }

  /**
   * 清理影响面（只读，不修改任何数据）。
   * 界面用它先告诉用户"会删掉什么、能释放多少"，再让用户确认。
   */
  function cleanupImpact() {
    return evaluateCleanupImpact(app.getState());
  }

  /** 放弃候选计划：只清理 pendingPreview，正式计划与所有时段零改动 */
  function discardPreview() {
    if (!getPendingPreview()) {
      return { ok: false, issues: [error(C.REQUIRED, 'preview', '当前没有待确认的候选计划。', {})] };
    }
    const commitResult = app.commit((state) => ({ ...state, pendingPreview: null }), { reason: 'preview-discard' });
    if (!commitResult.ok) return { ok: false, error: commitResult.error, issues: [] };
    return { ok: true };
  }

  /** 当前风险清单（优先取预览里的结果，否则不重算，避免界面误以为"风险已刷新"） */
  function currentRisks() {
    const preview = getPendingPreview();
    if (preview) return { source: 'preview', risks: preview.risks ?? [] };
    return { source: 'none', risks: [] };
  }


  /**
   * 重新计算"当前状态"的输入指纹，用于过期检测。
   *
   * 直接复用引擎导出的 `computeSchedulerInputHash`，保证服务层与引擎的指纹口径**完全一致**：
   * 任何会影响排程的数据变化都会在这里体现出来，过期预览因此无法被应用。
   */
  function computeLiveInputHash(state, now = null) {
    const nowWall = now ?? wallTimeFromDateObject(new Date(app.clock()));
    return computeSchedulerInputHash({
      state,
      now: nowWall,
      windowStart: state.officialPlan?.windowStart ?? nowWall.date,
      windowEnd: state.officialPlan?.windowEnd ?? addDays(nowWall.date, 6),
      engineVersion: state.officialPlan?.engineVersion ?? 'engine@1.0.0',
      completedByTask: {},
    });
  }

  /**
   * 把候选计划里引用的"草稿任务 ID"改写为"应用后真实任务 ID"。
   *
   * 场景：用户新增任务 → 预览（草稿里创建了一个临时任务实体）→ 确认应用。
   * 应用时会重新执行一次同样的变更，因此会产生一个**新的**真实任务 ID。
   * 候选计划里记录的 taskId 还是草稿 ID，必须按"新建任务的先后顺序"一一替换，
   * 否则计划块与时段会指向一个不存在的任务（整体校验会直接拒绝加载）。
   */
  function remapDraftTaskIds(candidate, beforeState, afterState, draftCreatedTaskIds) {
    const ids = draftCreatedTaskIds ?? [];
    if (ids.length === 0 || !candidate) return candidate;

    const beforeIds = new Set((beforeState.tasks ?? []).map((task) => task.id));
    const realNewIds = (afterState.tasks ?? []).filter((task) => !beforeIds.has(task.id)).map((task) => task.id);

    const mapping = new Map();
    ids.forEach((draftId, index) => {
      const realId = realNewIds[index];
      if (draftId && realId) mapping.set(draftId, realId);
    });
    if (mapping.size === 0) return candidate;

    const mapId = (id) => mapping.get(id) ?? id;
    return {
      ...candidate,
      blocks: (candidate.blocks ?? []).map((block) => (block.taskId ? { ...block, taskId: mapId(block.taskId) } : block)),
      unscheduled: (candidate.unscheduled ?? []).map((item) => ({ ...item, taskId: mapId(item.taskId) })),
    };
  }

  /** 过期预览的错误结果（统一文案，便于界面直接展示） */
  function stalePreview(reason, expected, actual) {
    return {
      ok: false,
      code: 'stale_preview',
      issues: [
        error(
          C.ENTITY_OVERLAP,
          'plan.version',
          `预览已过期：${reason}（预览基于 v${expected}，当前为 v${actual}）。为保护你的数据，本次应用已取消，请重新生成预览。`,
          { expected, actual, reason },
        ),
      ],
    };
  }

  /** 受保护时段（已完成 / 锁定 / 进行中）必须逐字段保留 */
  function checkProtectedSessions(nextSessions, previousSessions) {
    const previousById = new Map(previousSessions.map((session) => [session.id, session]));
    const nextById = new Map((nextSessions ?? []).map((session) => [session.id, session]));

    for (const session of previousSessions) {
      const mustKeep = session.state === SESSION_STATE.COMPLETED || session.locked === true || session.state === SESSION_STATE.IN_PROGRESS;
      if (!mustKeep) continue;
      const next = nextById.get(session.id);
      if (!next) {
        return error(
          session.state === SESSION_STATE.COMPLETED ? C.ENTITY_DANGLING_REF : C.ENTITY_DANGLING_REF,
          'sessions',
          session.state === SESSION_STATE.COMPLETED
            ? `已完成的学习时段（${session.date}）在本次计划中消失了，已取消应用以保护你的学习记录。`
            : `锁定的学习时段（${session.date}）在本次计划中消失了，已取消应用。请先解除锁定再重新规划。`,
          { sessionId: session.id, state: session.state, locked: session.locked },
        );
      }
      if (next.date !== session.date || next.startMinutes !== session.startMinutes || next.endMinutes !== session.endMinutes) {
        return error(
          C.ENTITY_OVERLAP,
          'sessions',
          session.state === SESSION_STATE.COMPLETED
            ? '已完成的学习时段被移动了位置，已取消应用以保护历史记录。'
            : '锁定的学习时段被移动了位置，已取消应用。锁定是硬约束，不会自动改动。',
          { sessionId: session.id },
        );
      }
      void previousById;
    }
    return null;
  }

  /**
   * 根据候选计划构造新的时段集合。
   *
   * 规则：
   * - 受保护时段（已完成 / 锁定 / 进行中）原样保留，不重建。
   * - 窗口内其它旧时段（flexible）在本次排程中被替换 → 标记为 cancelled（保留记录，不物理删除）。
   * - 候选计划中的新学习块 → 创建 StudySession（state=flexible，source=engine，带 reasonCodes）。
   */
  /**
   * 把候选计划里的学习片段转换成 StudySession。
   *
   * **身份稳定**是这里最重要的事：如果每次重新规划都换一批新 ID，
   * 差异引擎就会把"完全没变的时段"报成"全部取消 + 全部新增"，
   * 用户点一次"生成计划"就以为整个计划被推翻了，历史记录也会迅速膨胀。
   *
   * 因此这里做两件事：
   * 1. **身份匹配**：候选片段与既有片段（任务 + 日期 + 起止时间完全相同）视为同一段，
   *    直接复用既有 ID 与其历史（例如已经累计的专注分钟数）。
   * 2. **只取消真正被取代的**：身份没匹配上的既有片段才标记为已取消。
   *
   * 受保护时段（已完成 / 进行中 / 锁定）不参与匹配，永远原样保留。
   */
  /** 任务 id → 任务对象（差异文案需要任务标题） */
  function buildTaskMap(state) {
    return new Map((state.tasks ?? []).map((task) => [task.id, task]));
  }

  /** 会话身份键：任务 + 日期 + 起止时间 */
  function sessionIdentityKey(taskId, date, startMinutes, endMinutes) {
    return `${taskId}|${date}|${startMinutes}|${endMinutes}`;

  /**

    return el('div.card__hint', { text: emptyText });
  }

}

  }

  if (counts.resized) bullets.push(`调整 ${counts.resized} 个学习时段的时长`);
  if (counts.split) bullets.push(`把 ${counts.split} 个较长时段拆成多段`);
  if (counts.cancelled) bullets.push(`取消 ${counts.cancelled} 个不再需要的时段（记录会保留为历史）`);

    (session) => session.state === 'completed' || session.locked === true || session.state === 'in_progress',

  if (protectedCount > 0) {
    bullets.push(`已完成的 ${(state.sessions ?? []).filter((s) => s.state === 'completed').length} 条学习记录、已锁定的 ${(state.sessions ?? []).filter((s) => s.locked && s.state !== 'completed').length} 个时段都会被完整保留`);

  const unscheduled = preview.diff?.unscheduledAfter ?? [];

    bullets.push(`有 ${unscheduled.length} 个任务这次仍然无法完全安排，预览里会说明原因`);

  const bullets = describeChanges({ preview, state: state ?? { sessions: [] } });

    title: changeCount > 0 ? '确认应用这份计划？' : '确认生成一个新版本？',
    message:
      changeCount > 0
        ? '应用后，未来七天的学习安排会按上面的清单更新；当前正式计划会存为一个可以撤销的历史版本。'
        : '本次没有实际变化。应用只会记录一个新版本，计划内容与现在完全相同。',
    bullets,
    confirmLabel: changeCount > 0 ? '确认应用' : '仍然应用',
    confirmVariant: 'primary',
  });
  if (!confirmed) return;

  const result = services.ui.applyPreview();
  if (!result.ok) {
    // 失败原因要说清楚，并且明确告诉用户"数据没有被改动"
    const first = result.issues?.[0];

        ? '这份预览已经过期：等待确认期间数据又变了，因此没有应用。请重新点「生成计划」再确认。'

async function handleDiscard({ services }) {
  const result = services.ui.discardPreview();

    toast(result.issues?.[0]?.message ?? '放弃失败。', 'error');
    return;

function renderWeightsEditor({ services, settings }) {
  const inputs = {};
  const errorHost = el('div');

    ['difficulty', '难度'],
    ['importance', '重要程度'],
    ['procrastination', '拖延风险'],
  ];

  const sumHost = el('div', { class: 'card__hint' });
  const updateSum = () => {
    const total = fields.reduce((sum, [key]) => sum + (Number(inputs[key].value) || 0), 0);
    sumHost.textContent =
      Math.abs(total - 1) < 1e-9
        ? '四项权重之和为 1，符合常规设置。'
        : `四项权重之和为 ${Math.round(total * 1000) / 1000}，计算时会按比例换算（结果不受影响）。`;
  };

  const host = el('div', {}, [
    el('div', { class: 'card__hint', text: '优先级由截止紧迫度、难度、重要程度、拖延风险加权求和（只影响排序与安排偏好）' }),
    el(
      'div.grid-2',
      { style: { marginTop: 'var(--space-2)' } },
      fields.map(([key, label]) => {
        const input = el('input', {
          type: 'number',
          min: 0,
          max: 1,
          step: 0.05,
          value: settings.weights[key],
          id: `w-${key}`,
          on: { input: updateSum },
        });
        inputs[key] = input;
        return el('div.form-field', {}, [el('label', { for: `w-${key}`, text: label }), input]);
      }),
    ),
    sumHost,
    errorHost,
    el('div.form-actions', {}, [
      button('恢复默认权重（0.35 / 0.30 / 0.20 / 0.15）', {
        variant: 'ghost',
        onClick: () => {
          inputs.deadlineUrgency.value = 0.35;
          inputs.difficulty.value = 0.3;
          inputs.importance.value = 0.2;
          inputs.procrastination.value = 0.15;
          updateSum();
        },
      }),
      button('保存并生成预览', {
        variant: 'primary',
        onClick: () => {
          const weights = {};
          const issues = [];
          for (const [key] of fields) {
            const value = Number(inputs[key].value);
            if (!Number.isFinite(value) || value < 0) {
              issues.push({ severity: 'error', code: 'V032', path: `weights.${key}`, message: '权重必须是非负数字。' });
              continue;
            }
            weights[key] = value;
          }
          if (issues.length === 0 && fields.every(([key]) => weights[key] === 0)) {
            issues.push({ severity: 'error', code: 'V032', path: 'weights', message: '四项权重不能全为 0。' });
          }
          if (issues.length > 0) {
            showIssues(errorHost, issues);
            return;
          }
          const result = services.ui.previewWith([{ kind: 'settings.update', settings: { weights } }], {
            changeSummary: '修改优先级权重',
            trigger: 'settings-editor',

          toast('已生成候选计划预览：确认后权重才会生效。', 'success', 6000);
        },
      }),
    ]),
  ]);

  updateSum();
  return el('section.card', {}, [el('div.card__head', {}, [el('h2.card__title', { text: '优先级权重' })]), host]);
}

/** 统一的问题展示 */
function showIssues(host, issues) {
  const errors = (issues ?? []).filter((issue) => issue.severity === 'error' || !issue.severity);
  if (errors.length === 0) return;
  host.replaceChildren(
    notice({
      level: 'danger',
      title: `有 ${errors.length} 处需要修正`,
      message: errors.map((issue) => (issue.code ? formatIssue(issue) : issue.message)).join('\n'),
    }),
  );
  host.scrollIntoView({ block: 'nearest' });
}

function toMinutes(value) {
  const [hours, minutes] = String(value).split(':').map(Number);
  return hours * 60 + minutes;
}

function minutesToHHmm(minutes) {
  const wrapped = ((Number(minutes) % 1440) + 1440) % 1440;
  return `${String(Math.floor(wrapped / 60)).padStart(2, '0')}:${String(wrapped % 60).padStart(2, '0')}`;
}

return { named: {renderStudyWindowsEditor, renderNumericEditor, renderWeightsEditor, showIssues} };

/** 字节数的人类可读格式 */
function formatBytes(bytes) {
  if (bytes === null || bytes === undefined) return '—';
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

function toMinutes(value) {
  if (typeof value === 'number') return value;
  const m = /^(\d{2}):(\d{2})$/.exec(String(value ?? ''));
  return m ? Number(m[1]) * 60 + Number(m[2]) : 0;
}

function toHHmm(minutes) {
  const wrapped = ((minutes % 1440) + 1440) % 1440;
  return `${String(Math.floor(wrapped / 60)).padStart(2, '0')}:${String(wrapped % 60).padStart(2, '0')}`;
}

    source.buffer = buffer;
    source.loop = true;
    const gain = audioContext.createGain();
    gain.gain.value = Math.min(1, Math.max(0, volume));
    source.connect(gain).connect(audioContext.destination);
    source.start();
    ambientNodes = { source, gain };
  } catch {
    stopAmbient();
  }
}

  if (ambientNodes?.gain) ambientNodes.gain.gain.value = Math.min(1, Math.max(0, volume));

  try {
    ambientNodes?.source?.stop();
  } catch {
    /* 已经停止 */
  }
  ambientNodes = null;
  try {
    audioContext?.close();
  } catch {
    /* 忽略 */
  }
  audioContext = null;
}

function renderHome({ app, services, now }) {

    .filter((session) => session.date === today && session.state !== SESSION_STATE.CANCELLED)

          text: running ? '正在专注中' : nextSession ? `下一项：${taskById.get(nextSession.taskId)?.title ?? '学习任务'}` : activeTasks.length > 0 ? '今天还没有安排' : '先创建你的第一个任务',

    ]),
  );

    nodes.push(
      notice({
        level: 'warning',
        title: '有一份候选计划等待你确认',
        message: '生成计划只是第一步，还需要你在调整预览页确认之后才会生效。',
        actions: [button('查看调整预览', { size: 'sm', variant: 'primary', onClick: () => { globalThis.location.hash = '#/preview'; } })],
      }),

  /* ---------- 今日进度（真实数据） ---------- */
  const plannedMinutes = todaySessions.reduce((sum, session) => sum + session.plannedMinutes, 0);

          ]),

        ]);
      }),
    ),
  });
}

 * 工具
 * ------------------------------------------------------------------ */

function heroActions({ services, plan, activeTasks, running, nextSession, preview }) {
  const actions = [];
  if (preview) {
    actions.push(button('确认该计划', { variant: 'primary', onClick: () => { globalThis.location.hash = '#/preview'; } }));
  }
  if (running) {
    actions.push(button('回到专注', { variant: 'primary', onClick: () => { globalThis.location.hash = '#/focus'; } }));
  } else if (activeTasks.length > 0) {
    actions.push(
      button('开始专注', {
        variant: 'primary',
        onClick: () => {
          const state = services.app.getState();
          const target = (state.sessions ?? []).find(
            (session) => session.date === services.now().date && session.state === SESSION_STATE.FLEXIBLE,
          );
          const task = target ? (state.tasks ?? []).find((item) => item.id === target.taskId) : null;
          services.pomodoroService.attachTask({
            sessionId: target?.id ?? null,
            taskId: target?.taskId ?? null,
            taskTitle: task?.title ?? null,
          });
          services.pomodoroService.startFocus({
            sessionId: target?.id ?? null,
            taskId: target?.taskId ?? null,
            taskTitle: task?.title ?? null,
          });
          globalThis.location.hash = '#/focus';
        },
      }),
    );
  }
  actions.push(button('新建任务', { onClick: () => services.ui.openTaskForm(null) }));
  if (!plan || plan.version === 0) {
    actions.push(
      button('生成七天计划', {
        variant: plan ? 'default' : 'primary',
        onClick: () => {
          const result = services.ui.requestPreview({ changeSummary: '生成第一份计划', trigger: 'home-hero' });
          if (!result.ok) toast(result.message, 'error', 9000);
        },
      }),
    );
  }
  void nextSession;
  return actions;
}

function heroSubtitle({ running, nextSession, plan, preview, activeTasks, nowMinutes, taskById }) {
  if (preview) return '候选计划已就绪，确认后才会替换当前安排。';
  if (running) {
    const task = taskById.get(running.taskId);
    const left = Math.max(0, running.endMinutes - nowMinutes);
    return `${task?.title ?? '学习任务'}　还剩约 ${formatDuration(left)}（到 ${formatMinutes(running.endMinutes)}）。`;
  }
  if (nextSession) {
    const minutesUntil = nextSession.startMinutes - nowMinutes;
    return minutesUntil > 0
      ? `${formatMinutes(nextSession.startMinutes)} 开始，还有 ${formatDuration(minutesUntil)}。`
      : `原定 ${formatMinutes(nextSession.startMinutes)} 开始，已经可以开始了。`;
  }
  if (activeTasks.length > 0) {
    return plan && plan.version > 0
      ? `当前计划覆盖 ${plan.windowStart} → ${plan.windowEnd}，今天没有剩下的时段。`
      : `有 ${activeTasks.length} 个待办任务，点右侧「生成七天计划」开始排程。`;
  }
  return '创建任务后，系统会自动排出一份七天学习计划（不使用任何 AI，规则完全可解释）。';
}

function remainingText(task, state) {
  if (!task) return '任务已删除';
  const done = taskCompletedMinutes(task, state);
  const left = Math.max(0, task.plannedMinutes - done);
  return left > 0 ? `还剩 ${formatDuration(left)}` : '已完成全部计划时长';
}

function taskCompletedMinutes(task, state) {
  const sessions = (state.sessions ?? []).filter((session) => session.taskId === task.id && session.state === SESSION_STATE.COMPLETED);
  return sessions.reduce((sum, session) => sum + (session.actualMinutes ?? session.plannedMinutes ?? 0), 0);
}

function stateText(session) {
  if (session.state === SESSION_STATE.COMPLETED) return '已完成';
  if (session.state === SESSION_STATE.IN_PROGRESS) return session.paused ? '已暂停' : '进行中';
  return '待进行';
}

function stateKind(session) {
  if (session.state === SESSION_STATE.COMPLETED) return 'success';
  if (session.state === SESSION_STATE.IN_PROGRESS) return session.paused ? 'warning' : 'study';
  return 'neutral';
}

function greeting(minutes) {
  if (minutes < 6 * 60) return '夜深了，注意休息';
  if (minutes < 11 * 60) return '早上好';
  if (minutes < 14 * 60) return '中午好';
  if (minutes < 18 * 60) return '下午好';
  return '晚上好';
}


return { named: {renderHome, addDays} };

/* ------------------------------------------------------------------ *
 * 转盘绘制与动画
 * ------------------------------------------------------------------ */

/**
 * 绘制转盘。
 * `conic-gradient` 的每一段对应一个奖项，段的角度按奖项数量均分；
 * 权重只影响**被抽中的概率**，不影响扇区大小——这是常见做法，
 * 并且界面上会如实显示每个奖项的权重数值，不制造"扇区越大越容易"的误导。
 */
function buildWheel(items, { rotationDeg = 0 } = {}) {
  const slice = 360 / items.length;
  const stops = items
    .map((item, index) => {
      const from = index * slice;
      const to = (index + 1) * slice;
      return `${SLICE_COLORS[index % SLICE_COLORS.length]} ${from}deg ${to}deg`;
    })
    .join(', ');

  const labels = items.map((item, index) => {
    const angle = index * slice + slice / 2;
    return el(
      'div.wheel__label',
      {
        style: {
          transform: `rotate(${angle}deg) translateY(-38%) rotate(${-angle}deg)`,
        },
        title: `${item.label}（权重 ${item.weight}）`,
      },
      [el('span', { text: item.emoji ?? '🎁' }), el('span.wheel__label-text', { text: item.label })],
    );
  });

  return el('div.wheel', {}, [
    el('div.wheel__disc', {
      style: {
        background: `conic-gradient(${stops})`,
        transform: `rotate(${rotationDeg}deg)`,
        transition: 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 1)',
      },
    }),
    el('div.wheel__labels', { style: { transform: `rotate(${rotationDeg}deg)`, transition: 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 1)' } }, labels),
    el('div.wheel__hub', {}),
  ]);
}

/**
 * 转动：先由服务确定结果，再把转盘转到该扇区。
 *
 * 角度计算：指针固定在正上方（0°）。要让第 i 个扇区停在指针下，
 * 需要让转盘旋转 `360 * 圈数 - (i * slice + slice / 2)`，
 * 再加一点点随机偏移让每次停的位置不完全一样（但仍在同一扇区内）。
 */
function spinWheel({ host, items, result, onDone }) {
  const slice = 360 / items.length;
  const index = result.index;
  const fullTurns = 5;
  // 偏移限制在扇区内部 20%–80%，保证指针明确落在中奖扇区内
  const jitter = slice * (0.2 + 0.6 * Math.random());
  const targetDeg = fullTurns * 360 - (index * slice + jitter);

  host.replaceChildren(buildWheel(items, { rotationDeg: 0 }));
  const disc = host.querySelector?.('.wheel__disc');
  const labels = host.querySelector?.('.wheel__labels');
  // 强制一次样式计算，确保从 0° 开始过渡（否则部分浏览器会跳过动画）
  void host.offsetWidth;

  const apply = (deg) => {
    if (disc) disc.style.transform = `rotate(${deg}deg)`;
    if (labels) labels.style.transform = `rotate(${deg}deg)`;
  };
  // 用 requestAnimationFrame 保证初始 0° 已经生效
  const raf = globalThis.requestAnimationFrame ?? ((callback) => setTimeout(callback, 16));
  raf(() => apply(targetDeg));

  const settle = () => {
    apply(targetDeg % 360);
    onDone?.();
  };
  if (typeof globalThis.setTimeout === 'function') globalThis.setTimeout(settle, 4200);
  else settle();
}

function renderResult({ resultHost, result, services }) {
  resultHost.replaceChildren(
    el('div.wheel-result__card', {}, [
      el('div.wheel-result__emoji', { text: result.item.emoji ?? '🎁' }),
      el('div.wheel-result__label', { text: result.item.label }),
      el('div.card__hint', {
        text: result.forced
          ? '当前只启用了一个奖项，所以结果必然是它。'
          : '结果已记录到下方历史中；是否现在就去兑现完全由你决定。',
      }),
      el('div.form-actions', { style: { justifyContent: 'center' } }, [
        button('我已完成这个奖励', {
          size: 'sm',
          onClick: () => {
            const marked = services.rewardService.markClaimed(result.entry?.id);
            if (!marked.ok) return toast(marked.message ?? '记录失败。', 'error');
            toast('已记录：这个奖励已完成。', 'success');
          },
        }),
      ]),
    ]),
  );
}

/* ------------------------------------------------------------------ *
 * 奖项管理
 * ------------------------------------------------------------------ */

function renderItemManager({ services, items }) {
  const rows = items.map((item) => {
    const labelInput = el('input', { type: 'text', value: item.label, maxlength: '30', 'aria-label': '奖励名称' });
    const emojiInput = el('input', { type: 'text', value: item.emoji ?? '🎁', maxlength: '4', 'aria-label': '图标' });
    const weightInput = el('input', { type: 'number', min: '1', max: '10', step: '1', value: String(item.weight), 'aria-label': '权重' });
    const enabledInput = el('input', { type: 'checkbox', checked: item.enabled !== false, 'aria-label': '启用' });

    const save = () =>
      services.rewardService.updateItem(item.id, {
        label: labelInput.value,
        emoji: emojiInput.value,
        weight: Number(weightInput.value),
      });
    labelInput.addEventListener('change', save);
    emojiInput.addEventListener('change', save);
    weightInput.addEventListener('change', save);
    enabledInput.addEventListener('change', () => services.rewardService.toggleItem(item.id, enabledInput.checked));

    return el('li.item-row', {}, [
      enabledInput,
      el('div.item-row__emoji', {}, [emojiInput]),
      el('div.item-row__label', {}, [labelInput]),
      el('div.item-row__weight', {}, [
        el('span.card__hint', { text: '权重' }),
        weightInput,
      ]),
      button('删除', {
        size: 'sm',
        variant: 'ghost',
        onClick: () => {
          const result = services.rewardService.removeItem(item.id);
          if (!result.ok) return toast(result.message ?? '删除失败。', 'error');
          toast('已删除该奖项。', 'success');
        },
      }),
    ]);
  });

  const newLabel = el('input', { type: 'text', placeholder: '例如：看一集动画', maxlength: '30', id: 'new-reward-label' });
  const newEmoji = el('input', { type: 'text', value: '🎁', maxlength: '4', id: 'new-reward-emoji', style: { width: '56px' } });
  const newWeight = el('input', { type: 'number', min: '1', max: '10', value: '1', id: 'new-reward-weight', style: { width: '72px' } });

  return card({
    title: '我的奖项',
    hint: '权重越高越容易被抽到（权重 1–10）；关闭的奖项不参与抽奖，但仍保留在列表里',
    body: el('div', {}, [
      el('ul.item-list', {}, rows),
      el('div.item-add', {}, [
        newEmoji,
        newLabel,
        el('span.card__hint', { text: '权重' }),
        newWeight,
        button('新增奖项', {
          variant: 'primary',
          size: 'sm',
          onClick: () => {
            const result = services.rewardService.addItem({
              label: newLabel.value,
              emoji: newEmoji.value,
              weight: Number(newWeight.value),
            });
            if (!result.ok) return toast(result.message ?? '新增失败。', 'error');
            toast('已新增奖项。', 'success');
          },
        }),
        button('恢复默认奖项', {
          size: 'sm',
          onClick: async () => {
            const confirmed = await confirmDialog({
              title: '恢复默认奖项？',
              message: '会把你当前的奖项列表替换为默认示例（休息 5 分钟、听一首歌等）。已中奖的历史记录不受影响。',
              confirmLabel: '确认恢复',
              confirmVariant: 'danger',
            });
            if (!confirmed) return;
            const result = services.rewardService.restoreDefaults();
            toast(`已恢复 ${result.count} 个默认奖项。`, 'success');
          },
        }),
      ]),
    ]),
  });
}

return { named: {renderRewards} };
})();

  const sessions = state.sessions ?? [];
  const completed = sessions.filter((session) => session.state === 'completed');
  return {
    completedCount: completed.length,
    completedMinutes: completed.reduce((sum, session) => sum + (session.actualMinutes ?? session.plannedMinutes ?? 0), 0),
    lockedCount: sessions.filter((session) => session.locked && session.state !== 'completed').length,
    runningCount: sessions.filter((session) => session.state === 'in_progress').length,

      // 原因：主题与壁纸是通过 <html> 上的属性与 CSS 变量生效的，改动后浏览器会立刻重绘；
      // 如果再强制重建 DOM，会丢掉表单里正在输入的内容、打断动画，
      // 还会把重绘调度推到当前任务之后（在测试或快速切页时可能落到已卸载的环境里）。
      // 需要刷新自身状态的页面（设置页）用订阅回调局部更新自己。
    },
  });

  /* —— 专注（番茄钟）—— */
  services.pomodoroService = createPomodoroService({
    appearanceService: services.appearanceService,
    app,
    now: () => services.now(),
    // 计时精度只依赖真实毫秒时间戳；测试注入固定时钟时它也会跟着固定
    nowMs: () => readNow().getTime(),
  });
  // 完成的专注写入业务数据：这是"学习事实"，必须参与统计与剩余工作量推导。
  // 用 sourceKey 做幂等保护，重复提交同一轮不会写两次。
  services.pomodoroService.setRecordSink((record) => {
    const applied = applyDraftOp(
      app.getState(),
      {
        kind: 'focus.record',
        focusedSeconds: record.focusedSeconds,
        completed: record.completed,
        date: record.date,
        round: record.round,
        sessionId: record.sessionId,
        taskId: record.taskId,
        taskTitle: record.taskTitle,
        source: 'pomodoro',
        sourceKey: `pomodoro:${record.sessionId ?? 'none'}:${record.phase}:${record.round}`,
      },
      { idFactory, nowIso },
    );
    if (applied.ok && !applied.duplicate) app.commit(() => applied.state, { reason: 'focus-record' });
  });

  /* —— 奖励转盘 —— */
  services.rewardService = createRewardService({
    appearanceService: services.appearanceService,
    app,
    now: () => services.now(),
  });

  /* —— 通知提醒 —— */
  services.notificationService = createNotificationService({
    appearanceService: services.appearanceService,
    now: () => services.now(),
    clock: nowIso,
  });

  /* —— 学习统计 —— */
  services.statsService = createStatsService({ app, now: () => services.now() });
  services.planService = createPlanService({ app, idFactory });
  services.focusService = createFocusService({ app, idFactory, now: services.now });
  services.ui = createUiService({ services });

  const todayWall = services.now();
  // 主题必须在任何渲染之前落到 <html> 上：否则浅色主题下会先闪一下白底。
  services.appearanceService.applyAll();

  const pages = {
    home: renderHome,
    today: renderToday,
    week: renderWeek,
    day: renderDay,
    tasks: renderTasks,
    activities: renderActivities,
    preview: renderPreview,
    versions: renderVersions,
    settings: renderSettings,
    appearance: renderAppearance,
    notifications: renderNotifications,
    focus: renderFocus,
    rewards: renderRewards,
    stats: renderStats,
  };

  shell = createShell({
    root,
    app,
    services,
    pages,
    now: services.now,
    todayInfo: { date: todayWall.date, weekday: WEEKDAY_LABELS[todayWall.weekday - 1] },
  });

  // 数据变化 → 重新渲染当前页面（合帧，避免一次操作触发多次重绘）
  let scheduled = false;
  app.subscribe(() => {
    if (scheduled) return;
    scheduled = true;
    const schedule = globalThis.requestAnimationFrame ?? ((cb) => setTimeout(cb, 0));
    schedule(() => {
      scheduled = false;
      shell.render();
    });
  });

  startRouter((route) => shell.render(route));

  // 恢复上次保存的壁纸（IndexedDB 异步，不阻塞首屏）
  services.appearanceService.restoreWallpaper();

  // 通知调度：只有在"支持 + 已授权 + 用户开启"时才会真正生效（服务内部判断）
  services.notificationService.schedule(() => ({
    sessions: app.getState().sessions ?? [],
    tasks: app.getState().tasks ?? [],
    plan: app.getState().officialPlan,
    runningFocus: services.pomodoroService.getTimer(),
  }));
  services.notificationService.handleVisibility();

  return { app, services, shell, loadReport };
}

// 浏览器环境自动启动；测试环境（无 DOM）导入本模块不会产生副作用。
// 启动结果挂在 globalThis.__APP__ 上，便于在浏览器控制台排查问题（本地应用，不存在安全暴露面）。
if (typeof document !== 'undefined' && document.getElementById('app')) {
  const instance = boot();
  globalThis.__APP__ = instance;
}

return { named: {boot} };
})();
})();
</script>
</body>
</html>

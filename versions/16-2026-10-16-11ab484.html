<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>七天学习规划器（单文件版）</title>
<meta name="description" content="纯本地运行的七天学习规划器单文件版本，可直接双击打开。" />
<style>
/* ==========================================================================
   设计令牌（Design Tokens）
   所有颜色、间距、字号都集中在这里，禁止在其它样式文件中写死颜色值。
   这样将来要加深色主题或调整视觉风格时，只需要改这一个文件。
   ========================================================================== */

:root {
  /* —— 颜色：以"安静的学习工具"为目标，避免高饱和与大面积渐变 —— */
  --color-bg: #f6f7f9;
  --color-surface: #ffffff;
  --color-surface-alt: #f1f3f6;
  --color-border: #dfe3e8;
  --color-border-strong: #c3cad3;

  --color-text: #1c2430;
  --color-text-muted: #5b6675;
  --color-text-faint: #8a94a3;

  --color-primary: #2f6fd0;
  --color-primary-hover: #265bb0;
  --color-primary-soft: #e8f0fb;

  --color-study: #2f6fd0; /* 学习时段 */
  --color-study-soft: #dce9fa;
  --color-fixed: #8a94a3; /* 固定活动 */
  --color-fixed-soft: #edeff2;
  --color-rest: #3f9e7f; /* 计划休息 */
  --color-rest-soft: #dcefe8;
  --color-buffer: #b8912f; /* 机动缓冲 */
  --color-buffer-soft: #f6eed8;
  --color-locked: #6b4fd0; /* 已锁定 */
  --color-locked-soft: #e7e1fa;

  --color-danger: #c0392b;
  --color-danger-soft: #fbe9e7;
  --color-warning: #a9720f;
  --color-warning-soft: #fdf3dd;
  --color-success: #2f7d55;
  --color-success-soft: #e3f2ea;

  /* —— 间距 —— */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* —— 字体 —— */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
    'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 26px;

  /* —— 圆角与阴影：少量、克制 —— */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(28, 36, 48, 0.06);
  --shadow-md: 0 2px 8px rgba(28, 36, 48, 0.08);

  /* —— 布局尺寸 —— */
  --sidebar-width: 208px;
  --topbar-height: 56px;
  --timeline-hour-height: 56px; /* 时间轴每小时像素高度 */
  --timeline-start-hour: 6; /* 时间轴从 06:00 开始显示 */
  --timeline-end-hour: 24; /* 到 24:00 */
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ==========================================================================
   主题：浅色 / 深色 / 跟随系统
   规则：语义色一律通过令牌访问，任何组件都不得写死颜色。
   深色主题只需重定义下面这些变量，所有页面、弹窗、输入框、日历与图表会自动适配。
   ========================================================================== */

/* 显式选择的深色主题 */
:root[data-theme='dark'] {
  color-scheme: dark;

  --color-bg: #12161c;
  --color-surface: #1a1f27;
  --color-surface-alt: #222833;
  --color-border: #2e3641;
  --color-border-strong: #435062;

  --color-text: #e8edf4;
  --color-text-muted: #a7b2c1;
  --color-text-faint: #7b8798;

  --color-primary: #6ba4f0;
  --color-primary-hover: #8ab8f5;
  --color-primary-soft: #1e2c42;

  --color-study: #6ba4f0;
  --color-study-soft: #1e2c42;
  --color-fixed: #8b97a8;
  --color-fixed-soft: #262d38;
  --color-rest: #4fbf9a;
  --color-rest-soft: #172f28;
  --color-buffer: #d6ae4e;
  --color-buffer-soft: #302818;
  --color-locked: #9c85ee;
  --color-locked-soft: #251f3d;

  --color-danger: #f0776a;
  --color-danger-soft: #37201d;
  --color-warning: #e0b357;
  --color-warning-soft: #332a17;
  --color-success: #5cbd8b;
  --color-success-soft: #172e23;

  /* 深色下阴影要更重，否则卡片会"浮"不起来 */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
}

/* 跟随系统：仅在用户没有显式选择浅/深色时生效 */
@media (prefers-color-scheme: dark) {
  :root[data-theme='system'],
  :root:not([data-theme]) {
    color-scheme: dark;

    --color-bg: #12161c;
    --color-surface: #1a1f27;
    --color-surface-alt: #222833;
    --color-border: #2e3641;
    --color-border-strong: #435062;

    --color-text: #e8edf4;
    --color-text-muted: #a7b2c1;
    --color-text-faint: #7b8798;

    --color-primary: #6ba4f0;
    --color-primary-hover: #8ab8f5;
    --color-primary-soft: #1e2c42;

    --color-study: #6ba4f0;
    --color-study-soft: #1e2c42;
    --color-fixed: #8b97a8;
    --color-fixed-soft: #262d38;
    --color-rest: #4fbf9a;
    --color-rest-soft: #172f28;
    --color-buffer: #d6ae4e;
    --color-buffer-soft: #302818;
    --color-locked: #9c85ee;
    --color-locked-soft: #251f3d;

    --color-danger: #f0776a;
    --color-danger-soft: #37201d;
    --color-warning: #e0b357;
    --color-warning-soft: #332a17;
    --color-success: #5cbd8b;
    --color-success-soft: #172e23;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
  }
}

/* ==========================================================================
   自定义壁纸
   实现方式：壁纸放在一个固定的全屏背景层（#app-wallpaper）里，
   内容层叠在它上面。这样壁纸不参与文档流，也不影响任何组件的定位。
   可读性由两层保证：壁纸自身的遮罩（--wallpaper-scrim）+ 内容卡片的半透明底色。
   ========================================================================== */

:root {
  --wallpaper-scrim: 0.55; /* 遮罩不透明度：0 = 不遮，1 = 完全遮住 */
  --wallpaper-blur: 0px;
  --wallpaper-fit: cover;
}

#app-wallpaper {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-repeat: no-repeat;
  background-position: center;
  background-size: var(--wallpaper-fit);
  filter: blur(var(--wallpaper-blur));
  /* 模糊会让边缘出现透明带，稍微放大一点把边缘推到视口之外 */
  transform: scale(1.06);
}

#app-wallpaper::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--color-bg);
  opacity: var(--wallpaper-scrim);
}

/* 有壁纸时：容器与卡片改用半透明底色，让背景透出来但仍保证文字对比度 */
:root[data-wallpaper='on'] .app,
:root[data-wallpaper='on'] .app-main {
  background: transparent;
}

:root[data-wallpaper='on'] .card,
:root[data-wallpaper='on'] .app-nav,
:root[data-wallpaper='on'] .app-topbar,
:root[data-wallpaper='on'] .app-brand {
  background: color-mix(in srgb, var(--color-surface) 88%, transparent);
  backdrop-filter: blur(10px);
}


/* ==========================================================================
   基础样式：重置、排版、可访问性（焦点、对比度、键盘操作）
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--font-size-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-weight: 600;
  line-height: 1.35;
}

h1 {
  font-size: var(--font-size-xl);
}
h2 {
  font-size: var(--font-size-lg);
}
h3 {
  font-size: var(--font-size-md);
}

p {
  margin: 0 0 var(--space-3);
}

a {
  color: var(--color-primary);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

/* —— 键盘可达性：任何可聚焦元素都要有清晰轮廓 —— */
:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* —— 屏幕阅读器专用文本（用于图标按钮的可访问名称） —— */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* —— 跳转到主内容（键盘用户的第一个焦点） —— */
.skip-link {
  position: absolute;
  left: var(--space-3);
  top: -48px;
  z-index: 100;
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  transition: top 0.15s ease;
}
.skip-link:focus {
  top: var(--space-3);
}

/* —— 表单元素：统一外观，避免浏览器默认样式造成的不一致 —— */
input,
select,
textarea,
button {
  font: inherit;
  color: inherit;
}

input[type='text'],
input[type='number'],
input[type='date'],
input[type='time'],
select,
textarea {
  width: 100%;
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  color: var(--color-text);
}

input:disabled,
select:disabled,
textarea:disabled {
  background: var(--color-surface-alt);
  color: var(--color-text-faint);
}

label {
  display: block;
  font-size: var(--font-size-sm);
  font-weight: 500;
  color: var(--color-text-muted);
  margin-bottom: var(--space-1);
}

/* —— 表格：只在真正是表格数据时使用 —— */
table {
  border-collapse: collapse;
  width: 100%;
}
th,
td {
  text-align: left;
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--color-border);
}
th {
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
  font-weight: 600;
}

/* —— 滚动条：细一点，减少视觉噪音 —— */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--color-border-strong) transparent;
}
*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
*::-webkit-scrollbar-thumb {
  background: var(--color-border-strong);
  border-radius: 6px;
  border: 2px solid var(--color-bg);
}


/* ==========================================================================
   布局与组件样式
   命名约定：块级用 .app- / .card / .btn / .pill / .state；修饰用 -modifier。
   所有颜色与间距都引用 tokens.css 中的变量。
   ========================================================================== */

/* —— 应用外壳 —— */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  grid-template-rows: var(--topbar-height) 1fr;
  grid-template-areas:
    'brand topbar'
    'nav   main';
  min-height: 100vh;
}

.app-brand {
  grid-area: brand;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0 var(--space-4);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  border-bottom: 1px solid var(--color-border);
  font-weight: 600;
  letter-spacing: 0.01em;
}
.app-brand__mark {
  width: 20px;
  height: 20px;
  border-radius: var(--radius-sm);
  background: var(--color-primary);
  flex: none;
}

.app-topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: 0 var(--space-5);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}
.app-topbar__meta {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}
.app-topbar__actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.app-nav {
  grid-area: nav;
  padding: var(--space-4) var(--space-3);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}
.app-nav__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.app-nav__link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  font-weight: 500;
}
.app-nav__link:hover {
  background: var(--color-surface-alt);
  color: var(--color-text);
  text-decoration: none;
}
.app-nav__link[aria-current='page'] {
  background: var(--color-primary-soft);
  color: var(--color-primary-hover);
}
.app-nav__key {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 0 4px;
  font-variant-numeric: tabular-nums;
}

.app-nav__foot {
  margin-top: auto;
  border-top: 1px solid var(--color-border);
  padding-top: var(--space-3);
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.app-main {
  grid-area: main;
  padding: var(--space-5) var(--space-5) var(--space-7);
  min-width: 0;
}

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}
.page-head__sub {
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
  margin-top: var(--space-1);
}
.page-head__actions {
  display: flex;
  gap: var(--space-2);
  flex: none;
}

/* —— 卡片 —— */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  margin-bottom: var(--space-4);
}
.card--flush {
  padding: 0;
  overflow: hidden;
}
.card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.card__title {
  font-size: var(--font-size-md);
  font-weight: 600;
}
.card__hint {
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-4);
}

/* —— 按钮 —— */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  background: var(--color-surface-alt);
}
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.btn--primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}
.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
}
.btn--danger {
  border-color: var(--color-danger);
  color: var(--color-danger);
  background: var(--color-surface);
}
.btn--danger:hover:not(:disabled) {
  background: var(--color-danger-soft);
}
.btn--ghost {
  border-color: transparent;
  background: transparent;
  color: var(--color-text-muted);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--color-surface-alt);
  color: var(--color-text);
}
.btn--sm {
  padding: var(--space-1) var(--space-3);
  font-size: var(--font-size-sm);
}

/* —— 状态标签 —— */
.pill {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 1px var(--space-2);
  border-radius: 999px;
  font-size: var(--font-size-xs);
  font-weight: 500;
  border: 1px solid transparent;
  white-space: nowrap;
}
.pill--neutral {
  background: var(--color-surface-alt);
  color: var(--color-text-muted);
  border-color: var(--color-border);
}
.pill--study {
  background: var(--color-study-soft);
  color: var(--color-study);
}
.pill--fixed {
  background: var(--color-fixed-soft);
  color: var(--color-text-muted);
}
.pill--rest {
  background: var(--color-rest-soft);
  color: var(--color-rest);
}
.pill--buffer {
  background: var(--color-buffer-soft);
  color: var(--color-buffer);
}
.pill--locked {
  background: var(--color-locked-soft);
  color: var(--color-locked);
}
.pill--warning {
  background: var(--color-warning-soft);
  color: var(--color-warning);
}
.pill--danger {
  background: var(--color-danger-soft);
  color: var(--color-danger);
}
.pill--success {
  background: var(--color-success-soft);
  color: var(--color-success);
}

/* —— 提示条 / 空状态 / 错误状态 —— */
.notice {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background: var(--color-surface-alt);
  margin-bottom: var(--space-4);
}
.notice__title {
  font-weight: 600;
  margin-bottom: var(--space-1);
}
.notice--info {
  background: var(--color-primary-soft);
  border-color: #cfe0f7;
}
.notice--warning {
  background: var(--color-warning-soft);
  border-color: #f0e0b6;
}
.notice--danger {
  background: var(--color-danger-soft);
  border-color: #f2cfc9;
}
.notice--success {
  background: var(--color-success-soft);
  border-color: #cbe6d8;
}

.state {
  text-align: center;
  padding: var(--space-6) var(--space-4);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  color: var(--color-text-muted);
}
.state__title {
  font-size: var(--font-size-md);
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: var(--space-2);
}
.state__actions {
  margin-top: var(--space-4);
  display: flex;
  gap: var(--space-2);
  justify-content: center;
}

/* —— 数据摘要（避免无意义的大数字卡片堆砌，只保留必要的每日统计） —— */
.metric-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  align-items: baseline;
}
.metric {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 96px;
}
.metric__label {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}
.metric__value {
  font-size: var(--font-size-md);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* —— 图例 —— */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}
.legend__item {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
}
.legend__swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  border: 1px solid var(--color-border-strong);
}

/* —— 时间轴（七天视图与每日视图共用同一套刻度样式） —— */
.timeline {
  display: grid;
  grid-template-columns: 56px repeat(7, minmax(120px, 1fr));
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  overflow: auto;
  background: var(--color-surface);
  max-height: 70vh;
}
.timeline__corner,
.timeline__day-head,
.timeline__hour,
.timeline__day {
  border-right: 1px solid var(--color-border);
  border-bottom: 1px solid var(--color-border);
}
.timeline__corner,
.timeline__day-head {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--color-surface);
  padding: var(--space-2);
  font-size: var(--font-size-sm);
  font-weight: 600;
}
.timeline__day-head {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.timeline__day-head[aria-current='date'] {
  color: var(--color-primary-hover);
  background: var(--color-primary-soft);
}
.timeline__day-meta {
  font-size: var(--font-size-xs);
  font-weight: 400;
  color: var(--color-text-muted);
}
.timeline__hour {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--color-surface);
  padding: var(--space-1) var(--space-2);
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
  height: var(--timeline-hour-height);
}
.timeline__day {
  position: relative;
  height: calc(var(--timeline-hour-height) * (var(--timeline-end-hour) - var(--timeline-start-hour)));
  background-image: repeating-linear-gradient(
    to bottom,
    var(--color-border) 0,
    var(--color-border) 1px,
    transparent 1px,
    transparent var(--timeline-hour-height)
  );
}
.timeline__block:focus-visible {
  outline: 2px solid var(--color-text);
  outline-offset: 1px;
  z-index: 3;
}

.timeline__block {
  position: absolute;
  left: 2px;
  right: 2px;
  border-radius: var(--radius-sm);
  padding: 2px var(--space-2);
  font-size: var(--font-size-xs);
  line-height: 1.25;
  overflow: hidden;
  border-left: 3px solid transparent;
  cursor: pointer;
  text-align: left;
  background: var(--color-surface);
}
.timeline__block--study {
  background: var(--color-study-soft);
  border-left-color: var(--color-study);
  color: #1d3f70;
}
.timeline__block--study.is-locked {
  background: var(--color-locked-soft);
  border-left-color: var(--color-locked);
  color: #3d2d78;
}
.timeline__block--fixed {
  background: var(--color-fixed-soft);
  border-left-color: var(--color-fixed);
  color: var(--color-text-muted);
}
.timeline__block--rest {
  background: var(--color-rest-soft);
  border-left-color: var(--color-rest);
  color: #1f5b47;
}
.timeline__block--buffer {
  background: var(--color-buffer-soft);
  border-left-color: var(--color-buffer);
  color: #6b5514;
  border-left-style: dashed;
}
.timeline__block__time {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* —— 任务列表 —— */
.task-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.task-item {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.task-item:last-child {
  border-bottom: none;
}
.task-item__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
}
.task-item__title {
  font-weight: 600;
}
.task-item__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  align-items: center;
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}
.task-item__actions {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

/* —— 表单 —— */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
}
.form-field {
  display: flex;
  flex-direction: column;
}
.form-field--full {
  grid-column: 1 / -1;
}
.form-field__hint {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  margin-top: var(--space-1);
}
.form-field__error {
  font-size: var(--font-size-xs);
  color: var(--color-danger);
  margin-top: var(--space-1);
}
.form-actions {
  display: flex;
  gap: var(--space-2);
  justify-content: flex-end;
  margin-top: var(--space-4);
}
fieldset {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4) var(--space-4);
  margin: 0 0 var(--space-4);
}
legend {
  padding: 0 var(--space-2);
  font-weight: 600;
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
}

/* —— 可聚焦的滚动区域（时间轴）—— */
.timeline:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}

/* —— 屏幕阅读器专用提示 —— */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* —— 表格型列表（版本历史） —— */
.table-wrap {
  overflow-x: auto;
}

/* —— 诊断列表（未安排原因、冲突与风险） —— */
.diag-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.diag-item {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-alt);
  font-size: var(--font-size-sm);
}
.diag-item__code {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  flex: none;
}

/* —— 窄屏适配：侧边栏收起为顶部标签，网格变单列 —— */
@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr;
    grid-template-areas:
      'brand'
      'nav'
      'main';
  }
  .app-topbar {
    grid-area: brand;
    border-bottom: 1px solid var(--color-border);
  }
  .app-brand {
    display: none;
  }
  .app-nav {
    flex-direction: row;
    overflow-x: auto;
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }
  .app-nav__list {
    flex-direction: row;
    gap: var(--space-1);
  }
  .app-nav__key {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 0 4px;
  font-variant-numeric: tabular-nums;
}

.app-nav__foot {
    margin-top: 0;
    border-top: none;
    padding-top: 0;
    flex-direction: row;
    align-items: center;
    gap: var(--space-2);
    white-space: nowrap;
  }
  .app-main {
    padding: var(--space-4);
  }
  .grid-2,
  .grid-3,
  .form-grid {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   首页、统计与进度组件
   ========================================================================== */

/* —— 首页主视觉 —— */
.home-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-5);
  flex-wrap: wrap;
  padding: var(--space-5);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--color-primary-soft), var(--color-surface));
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
}

.home-hero__date {
  margin: 0 0 var(--space-1);
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}

.home-hero__title {
  margin: 0 0 var(--space-2);
  font-size: var(--font-size-xl);
  line-height: 1.25;
}

.home-hero__sub {
  margin: 0;
  color: var(--color-text-muted);
  max-width: 60ch;
}

.home-hero__actions {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

/* —— 统计磁贴 —— */
.home-tiles,
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: var(--space-3);
}

.stat-tile {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  text-align: left;
}

.stat-tile--button {
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
}

.stat-tile--button:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
  border-color: var(--color-border-strong);
}

.stat-tile__label {
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
}

.stat-tile__value {
  font-size: var(--font-size-lg);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.stat-tile__hint {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
}

/* —— 进度条 —— */
.progress {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-top: var(--space-2);
}

.progress__head {
  display: flex;
  justify-content: space-between;
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

.progress__value {
  font-variant-numeric: tabular-nums;
}

.progress__track {
  height: 6px;
  border-radius: 999px;
  background: var(--color-surface-alt);
  overflow: hidden;
}

.progress__fill {
  height: 100%;
  border-radius: 999px;
  background: var(--color-primary);
  transition: width 240ms ease;
}

.progress__fill--rest { background: var(--color-rest); }
.progress__fill--buffer { background: var(--color-buffer); }
.progress__fill--locked { background: var(--color-locked); }
.progress__fill--danger { background: var(--color-danger); }

.progress__hint {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
}

/* —— 首页两列布局 —— */
.home-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.home-grid__main,
.home-grid__side {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
}

@media (max-width: 1080px) {
  .home-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* —— 下一项学习 —— */
.home-next__task {
  margin-bottom: var(--space-2);
}

.home-next__title {
  font-size: var(--font-size-md);
  font-weight: 600;
}

.home-next__meta {
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}

/* —— 最近七天迷你柱状图 —— */
.week-bars {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--space-2);
  align-items: end;
  height: 132px;
}

.week-bars__col {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  height: 100%;
}

.week-bars__bars {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 3px;
  height: 100%;
}

.week-bars__bar {
  width: 12px;
  min-height: 2px;
  border-radius: 3px 3px 0 0;
  transition: height 240ms ease;
}

.week-bars__bar--planned {
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.week-bars__bar--actual {
  background: var(--color-primary);
}

.week-bars__label {
  text-align: center;
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

/* —— 占比条 —— */
.share-bars {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.share-bars__head {
  display: flex;
  justify-content: space-between;
  font-size: var(--font-size-sm);
  margin-bottom: var(--space-1);
}

.share-bars__value {
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}

.share-bars__track {
  height: 8px;
  border-radius: 999px;
  background: var(--color-surface-alt);
  overflow: hidden;
}

.share-bars__fill {
  height: 100%;
  border-radius: 999px;
  background: var(--color-primary);
}

.share-bars__fill--rest { background: var(--color-rest); }
.share-bars__fill--buffer { background: var(--color-buffer); }
.share-bars__fill--locked { background: var(--color-locked); }

/* —— 柱状图 —— */
.chart {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: var(--space-2);
  align-items: end;
}

.chart__col {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  height: 100%;
  gap: var(--space-1);
}

.chart__bar-wrap {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  height: 100%;
}

.chart__bar {
  width: 60%;
  min-height: 2px;
  border-radius: 4px 4px 0 0;
  background: var(--color-primary);
  transition: height 260ms ease;
}

.chart__bar--rest { background: var(--color-rest); }
.chart__bar--buffer { background: var(--color-buffer); }
.chart__bar--locked { background: var(--color-locked); }
.chart__bar--danger { background: var(--color-danger); }

.chart__label {
  text-align: center;
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
}

/* —— 完成的清单项 —— */
.task-item--done {
  opacity: 0.68;
}

.task-item--done strong {
  text-decoration: line-through;
}

/* ==========================================================================
   主题选项、转盘、番茄钟、通知列表
   ========================================================================== */

/* —— 主题选项卡片 —— */
.theme-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-3);
}

.theme-option {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-4);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  cursor: pointer;
  font: inherit;
  color: inherit;
  text-align: left;
  transition: border-color 140ms ease, transform 140ms ease;
}

.theme-option:hover {
  transform: translateY(-1px);
  border-color: var(--color-border-strong);
}

.theme-option.is-active {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px var(--color-primary-soft);
}

.theme-option__preview {
  display: flex;
  gap: 6px;
  height: 44px;
  padding: 8px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
}

.theme-option__preview--light { background: #f6f7f9; }
.theme-option__preview--dark { background: #12161c; }
.theme-option__preview--system { background: linear-gradient(90deg, #f6f7f9 50%, #12161c 50%); }

.theme-option__swatch {
  flex: 1;
  border-radius: var(--radius-sm);
}

.theme-option__preview--light .theme-option__swatch:nth-child(1) { background: #2f6fd0; }
.theme-option__preview--light .theme-option__swatch:nth-child(2) { background: #ffffff; border: 1px solid #dfe3e8; }
.theme-option__preview--light .theme-option__swatch:nth-child(3) { background: #3f9e7f; }

.theme-option__preview--dark .theme-option__swatch:nth-child(1) { background: #6ba4f0; }
.theme-option__preview--dark .theme-option__swatch:nth-child(2) { background: #1a1f27; border: 1px solid #2e3641; }
.theme-option__preview--dark .theme-option__swatch:nth-child(3) { background: #4fbf9a; }

.theme-option__preview--system .theme-option__swatch { background: rgba(47, 111, 208, 0.65); }

.theme-option__name {
  font-weight: 600;
}

.theme-option__desc {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

/* —— 滑块行 —— */
.slider-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.slider-row input[type='range'] {
  flex: 1;
  accent-color: var(--color-primary);
}

/* —— 壁纸预览块 —— */
.appearance-preview {
  margin-top: var(--space-4);
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px dashed var(--color-border-strong);
  background: var(--color-surface-alt);
}

.appearance-preview__card {
  padding: var(--space-3);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--color-surface) 88%, transparent);
  backdrop-filter: blur(6px);
  border: 1px solid var(--color-border);
}

/* —— 专注计时圆环 —— */
.focus-timer {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  align-items: center;
}

.focus-timer__ring {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  background: radial-gradient(circle at 50% 40%, var(--color-primary-soft), var(--color-surface));
  border: 6px solid var(--color-primary);
  box-shadow: var(--shadow-md);
}

.focus-timer__value {
  font-size: 46px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: 1px;
  line-height: 1;
}

.focus-timer__phase {
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
}

.focus-timer .progress { width: 100%; max-width: 420px; }

@media (max-width: 560px) {
  .focus-timer__ring { width: 168px; height: 168px; border-width: 5px; }
  .focus-timer__value { font-size: 34px; }
}

/* —— 奖励转盘 —— */
.wheel-layout {
  display: grid;
  grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
  gap: var(--space-5);
  align-items: center;
}

@media (max-width: 900px) {
  .wheel-layout { grid-template-columns: minmax(0, 1fr); }
}

.wheel-layout__side {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  align-items: center;
}

.wheel-pointer {
  font-size: 24px;
  color: var(--color-primary);
  line-height: 1;
}

.wheel-host {
  width: 300px;
  height: 300px;
  max-width: 100%;
}

.wheel {
  position: relative;
  width: 100%;
  height: 100%;
}

.wheel__disc {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 6px solid var(--color-surface);
  box-shadow: var(--shadow-md);
}

.wheel__labels {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
}

.wheel__label {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 90px;
  margin: -12px 0 0 -45px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 11px;
  line-height: 1.15;
  color: #ffffff;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
  text-align: center;
}

.wheel__label-text {
  max-width: 90px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.wheel__hub {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 52px;
  height: 52px;
  margin: -26px 0 0 -26px;
  border-radius: 50%;
  background: var(--color-surface);
  border: 4px solid var(--color-primary);
  box-shadow: var(--shadow-sm);
}

.wheel-result__card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-4);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-border);
  background: var(--color-surface);
  width: 100%;
  text-align: center;
}

.wheel-result__emoji { font-size: 34px; line-height: 1; }
.wheel-result__label { font-size: var(--font-size-lg); font-weight: 650; }

/* —— 奖项与触发规则列表 —— */
.item-list,
.trigger-list,
.notify-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.item-row,
.trigger-row,
.notify-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  flex-wrap: wrap;
}

.item-row__emoji input { width: 52px; text-align: center; }
.item-row__label { flex: 1 1 160px; min-width: 140px; }
.item-row__label input { width: 100%; }
.item-row__weight { display: flex; align-items: center; gap: var(--space-2); }
.item-row__weight input { width: 70px; }

.item-add {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-4);
  padding-top: var(--space-4);
  border-top: 1px solid var(--color-border);
  flex-wrap: wrap;
}

.item-add input[type='text'] { flex: 1 1 200px; min-width: 160px; }

.trigger-row__main,
.notify-row__main { flex: 1 1 240px; }

.trigger-row__label,
.notify-row__label {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-weight: 500;
}

.trigger-row__config {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-1);
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
}

.trigger-row__config input { width: 72px; }

.trigger-row__state,
.notify-row__state { flex: 0 0 auto; }

/* —— 成就卡片 —— */
.achievement-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: var(--space-3);
}

.achievement {
  padding: var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-alt);
}

.achievement.is-achieved {
  border-color: var(--color-success);
  background: var(--color-success-soft);
}

.achievement__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.achievement__label {
  font-weight: 600;
}

/* ==========================================================================
   固定专注功能栏：计时进行中时出现在每一页顶部
   ========================================================================== */

.focus-bar {
  position: fixed;
  left: var(--sidebar-width);
  right: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-5);
  background: color-mix(in srgb, var(--color-surface) 94%, transparent);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--color-border);
  box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.08);
  font-size: var(--font-size-sm);
}

.focus-bar[hidden] {
  display: none;
}

.focus-bar__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--color-primary);
  animation: focus-pulse 1.6s ease-in-out infinite;
  flex: 0 0 auto;
}

.focus-bar__dot.is-paused {
  background: var(--color-warning);
  animation: none;
}

@keyframes focus-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.82); }
}

.focus-bar__phase {
  color: var(--color-text-muted);
  flex: 0 0 auto;
}

.focus-bar__time {
  font-size: var(--font-size-md);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}

.focus-bar__task {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--color-text-muted);
}

.focus-bar__actions {
  display: flex;
  gap: var(--space-2);
  flex: 0 0 auto;
}

/* 有专注栏时给主内容留出底部空间，避免遮住最后一屏内容 */
:root[data-focus-bar='on'] .app-main {
  padding-bottom: 72px;
}

@media (max-width: 900px) {
  .focus-bar {
    left: 0;
    padding: var(--space-2) var(--space-3);
    flex-wrap: wrap;
  }
  .focus-bar__task { display: none; }
}

/* ==========================================================================
   响应式：手机与窄屏
   桌面是"左侧栏 + 主区"的两列布局；窄屏改为单列纵向堆叠，
   导航变成可横向滚动的一行，保证任何屏幕宽度下都能操作与阅读。
   ========================================================================== */

@media (max-width: 900px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr);
    grid-template-areas:
      'brand'
      'topbar'
      'nav'
      'main';
  }

  .app-brand {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
  }

  .app-topbar {
    border-left: none;
    border-bottom: 1px solid var(--color-border);
    flex-wrap: wrap;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
  }

  /* 导航改为横向滚动的标签条：不用汉堡菜单也能一键直达任意页面 */
  .app-nav {
    padding: var(--space-2) var(--space-3);
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    gap: var(--space-2);
    overflow-x: auto;
  }

  .app-nav__list {
    flex-direction: row;
    gap: var(--space-1);
    min-width: max-content;
  }

  .app-nav__link {
    white-space: nowrap;
    padding: var(--space-2) var(--space-3);
  }

  /* 窄屏下快捷键数字没有意义，隐藏以免占用宽度 */
  .app-nav__key {
    display: none;
  }

  .app-main {
    padding: var(--space-3);
  }

  /* 表格在窄屏允许横向滚动，而不是把内容压变形 */
  .table-wrap {
    overflow-x: auto;
  }

  .home-hero {
    padding: var(--space-4);
  }

  .home-hero__actions {
    width: 100%;
  }

  .home-hero__actions .btn {
    flex: 1 1 auto;
  }
}

@media (max-width: 560px) {
  .metric-row {
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  }

  .home-tiles,
  .stat-grid {
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }

  .card {
    padding: var(--space-3);
  }

  .task-item__head {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
  }

  .task-item__actions {
    width: 100%;
    flex-wrap: wrap;
  }
}

</style>
</head>

/** 单个 StudySession 计入"已完成工作量"的分钟数：优先实际时长，缺省用计划时长 */

  return total;

/**

 * 用户在任务里填"已完成 30 分钟"就是把这个事实告诉系统。
 *
 * 注意：剩余时长**依然是派生值**（预计总用时 − 已完成），从不单独存储，
 * 因此不会出现"剩余时长与记录不一致"的脏数据。
 */

  if (!Number.isFinite(number) || number <= 0) return 0;
  return Math.floor(number);

  if (!Number.isFinite(value) || value <= 0) return 0;
  return Math.floor(value);
}

/** 合计已完成时长（手工声明 + 应用内完成记录） */

  return claimedPriorMinutes(task) + completedMinutesForTask(task.id, sessions);

/**
 * 汇总某任务当前**未完成**时段的计划分钟数（排除 completed；包含 flexible / in_progress）。
 * 与 completedMinutes 一起用于 V016 一致性校验。
 */

  let total = 0;
  for (const s of sessions) {
    if (s && s.taskId === taskId && s.state !== 'completed' && s.state !== 'cancelled') total += s.plannedMinutes ?? 0;
  }
  return total;
}

/**
 * 剩余工作量（引擎排程的唯一依据）。
 * 已取消/已完成任务返回 0；clamp 到 ≥ 0（超额完成不会产生负数需求）。
 */
function remainingMinutesForTask(task, sessions = []) {
  if (!task) return 0;
  if (task.status === TASK_STATUS.COMPLETED || task.status === TASK_STATUS.CANCELLED || task.status === TASK_STATUS.DELETED) {
    return 0;
  }
  const remaining = (task.plannedMinutes ?? 0) - totalCompletedMinutesForTask(task, sessions);
  return remaining > 0 ? remaining : 0;

/**
 * 任务的三重一致性校验（跨任务与时段）：
 *   T1 已完成分钟数 ≤ 预计总用时        （否则 V015）
 *   T2 未完成时段的计划总长 ≤ 剩余工作量（否则 V016）
 * 不比较"必须完全相等"是有意为之：7 天窗口之外的任务不会被排入，
 * 因此未排完不等于数据错误；这里只拦截**超出**这种真正矛盾的情况。
 */

  const issues = [];
  const completed = totalCompletedMinutesForTask(task, sessions);
  if (completed > task.plannedMinutes) {
    issues.push(
      error(
        C.TASK_OVER_COMPLETED,
        `${path}.plannedMinutes`,
        `"${task.title}" 的已完成时长（${completed} 分钟）超过了预计总用时（${task.plannedMinutes} 分钟）。请调大预计总用时，或撤销某段完成的记录。`,
        { taskId: task.id, completed, plannedMinutes: task.plannedMinutes },
      ),
    );
  }
  const pending = pendingPlannedMinutesForTask(task.id, sessions);
  const remaining = remainingMinutesForTask(task, sessions);
  if (pending > remaining) {
    issues.push(
      error(
        C.TASK_DURATION_INCONSISTENT,
        `${path}.plannedMinutes`,
        `"${task.title}" 未完成时段合计 ${pending} 分钟，但剩余工作量只有 ${remaining} 分钟（已排时段超过了剩余工作量）。请重新规划或调整预计总用时。`,
        { taskId: task.id, pending, remaining },
      ),
    );
  }
  return result(issues);

  'title',
  'subject',
  'plannedMinutes',
  'deadlineDate',
  'deadlineTime',
  'importance',
  'difficulty',
  'procrastination',
  'splittable',
  'minChunkMinutes',
  'maxChunkMinutes',
  'dependsOn',
  'note',
  'priorCompletedMinutes',
]);

/**
 * 应用一次局部修改，返回**新对象**（不修改入参，便于撤销与预览）。
 * 处理两个衍生规则：
 * - splittable 变为 false：把 min/max 对齐到计划总用时；计划用时变化时同步对齐。
 * - splittable 为 true 且时长变化后 min > max：把 max 抬到 min（并保留提示由校验器输出）。
 */
function applyTaskPatch(task, patch, ctx) {
  if (!isPlainObject(patch)) throw new TypeError('patch 必须是对象');
  if (!ctx || typeof ctx.nowIso !== 'string') throw new TypeError('applyTaskPatch 需要 ctx.nowIso');

  const next = { ...task, dependsOn: [...(task.dependsOn ?? [])] };
  for (const key of Object.keys(patch)) {
    if (!TASK_PATCHABLE_FIELDS.includes(key)) continue;
    next[key] = patch[key];
  }
  if (Array.isArray(next.dependsOn)) next.dependsOn = [...new Set(next.dependsOn)];
  if (typeof next.title === 'string') next.title = next.title.trim();
  if (typeof next.subject === 'string') next.subject = next.subject.trim();

  if (next.splittable === false) {
    next.minChunkMinutes = next.plannedMinutes;
    next.maxChunkMinutes = next.plannedMinutes;
  } else if (isPositiveInt(next.minChunkMinutes) && isPositiveInt(next.maxChunkMinutes) && next.minChunkMinutes > next.maxChunkMinutes) {
    next.maxChunkMinutes = next.minChunkMinutes;
  }

  next.updatedAt = ctx.nowIso;
  return next;
}

/**

 * 非法迁移返回原任务 + 结构化错误，绝不静默忽略。

  if (!canTransitionTask(task.status, to)) {
    return {
      task,
      issue: error(
        C.ENUM,
        'task.status',
        `任务状态不能从「${task.status}」直接变为「${to}」。`,
        { from: task.status, to },
      ),
    };
  }
  const next = { ...task, status: to, updatedAt: ctx.nowIso };
  if (to === TASK_STATUS.IN_PROGRESS && !next.startedAt) next.startedAt = ctx.nowIso;
  if (to === TASK_STATUS.COMPLETED) next.completedAt = ctx.nowIso;
  if (to === TASK_STATUS.CANCELLED) next.cancelledAt = ctx.nowIso;
  if (to === TASK_STATUS.DELETED) next.deletedAt = ctx.nowIso;
  if (to === TASK_STATUS.NOT_STARTED) {
    next.startedAt = null;
    next.completedAt = null;
    next.cancelledAt = null;
    next.deletedAt = null;
  }
  if (to === TASK_STATUS.IN_PROGRESS && task.status === TASK_STATUS.COMPLETED) next.completedAt = null;
  return { task: next, issue: null };

/** 依赖图工具：找出依赖会形成环的候选（用于 UI 在选择前置任务时禁用非法选项） */
function findCyclicDependencyCandidate(taskId, candidateDepId, tasks = []) {
  const byId = new Map(tasks.map((t) => [t.id, t]));
  const stack = [candidateDepId];
  const seen = new Set();
  while (stack.length > 0) {
    const current = stack.pop();
    if (current === taskId) return true;
    if (seen.has(current)) continue;
    seen.add(current);
    const node = byId.get(current);
    if (node && Array.isArray(node.dependsOn)) stack.push(...node.dependsOn);
  }

    makeId: (kind, date, startMinutes, index) => deriveBlockId(kind, inputHash, date, startMinutes, index),
  });

  // 用真实的任务与片段信息重写学习块 ID，保证"同一任务同一片段 → 同一 ID"
  const placements = reassignSessionIds(placementResult.placements, fragmentsByTask, inputHash);

  /* ---------- 第 6b 步：无法放置的片段 ---------- */
  const placedByTask = countPlacedMinutes(placements);
  for (const entry of orderedEntries) {
    const planned = remainingByTask.get(entry.task.id) ?? 0;
    const placed = placedByTask.get(entry.task.id) ?? 0;
    if (placed >= planned) continue;
    const already = unscheduled.find((item) => item.taskId === entry.task.id);
    if (already) continue;
    const missing = planned - placed;
    // 不可拆分任务放不下的原因要准确：是"没有足够长的连续空档"，而不是"总容量不足"
    const longestSlot = capacityDays.reduce((max, day) => Math.max(max, longestFreeSlot(day.freeWindows)), 0);
    const isAtomic = entry.task.splittable === false;
    const atomicNoSlot = isAtomic && longestSlot < entry.task.plannedMinutes;
    unscheduled.push(
      buildUnscheduled({
        task: entry.task,
        remainingMinutes: missing,
        reasonCode: atomicNoSlot ? UNSCHEDULED_REASON.NON_SPLITTABLE_NO_SLOT : UNSCHEDULED_REASON.INSUFFICIENT_CAPACITY,
        extra: { gapMinutes: missing, longestFreeSlot: longestSlot, totalSchedulable },
      }),
    );
  }

  /* ---------- 第 7 步：局部优化 ---------- */
  const optimized = optimizePlacements({
    placements,
    policy,
    // 占用集合 = 保留时段（锁定/进行中/已完成）+ 固定活动。
    // 只考虑保留时段会让"向前压缩"把片段挪进上课时间，从而产生 H1 违规。
    occupiedSpans: [...reservedSpans, ...fixedSpans],
    studyWindows: state.settings?.studyWindows ?? {},
    taskById,
    passes: input.optimizationPasses ?? policy.optimizationPasses,
  });

  /* ---------- 第 8 步：组装时间轴块 ---------- */
  // 只把 kind='study' 的放置结果转成学习块。
  // 早期版本直接 map 整个 optimized 数组，导致休息块被当成学习块统计（时长翻倍、并触发 H2 误报）。
  const studyBlocks = optimized
    .filter((placement) => placement.kind === 'study')
    .map((placement) => ({
    id: placement.id,
    kind: BLOCK_KIND.STUDY,
    date: placement.date,
    startMinutes: placement.startMinutes,
    endMinutes: placement.endMinutes,
    refId: placement.id,
    taskId: placement.taskId,
    subject: placement.subject,
    label: placement.label,
    locked: false,
    derived: false,
    meta: { undersized: placement.undersized, reasons: placement.reasons, plannedMinutes: placement.plannedMinutes },
  }));

  const reservedBlocks = [...reservedSessions, ...outOfWindowReserved].map((session) => ({
    id: `blk_reserved_${session.id}`,
    kind: BLOCK_KIND.STUDY,
    date: session.date,
    startMinutes: session.startMinutes,
    endMinutes: session.endMinutes,
    refId: session.id,
    taskId: session.taskId,
    subject: taskById.get(session.taskId)?.subject ?? null,
    label: taskById.get(session.taskId)?.title ?? '学习时段',
    locked: Boolean(session.locked),
    derived: false,
    meta: { state: session.state, plannedMinutes: session.plannedMinutes, reserved: true },
  }));

  const fixedBlocks = fixedSpans.map((span) => ({
    id: `blk_fixed_${span.activityId}_${span.date}_${span.startMinutes}`,
    kind: BLOCK_KIND.FIXED,
    date: span.date,
    startMinutes: span.startMinutes,
    endMinutes: span.endMinutes,
    refId: span.activityId,
    label: span.title ?? '固定活动',
    locked: false,
    derived: false,
    meta: { type: span.type },
  }));

  const restBlocks = optimized
    .filter((placement) => placement.kind === 'rest')
    .map((placement) => ({
      id: placement.id,
      kind: BLOCK_KIND.REST,
      date: placement.date,
      startMinutes: placement.startMinutes,
      endMinutes: placement.endMinutes,
      refId: null,
      label: '休息',
      locked: false,
      derived: true,
      meta: { plannedMinutes: placement.plannedMinutes },
    }));

  const bufferBlocks = buildBufferBlocks({
    days: capacityDays,
    studyBlocks: [...studyBlocks, ...reservedBlocks],
    restBlocks,
    inputHash,
  });

  const blocks = [...studyBlocks, ...reservedBlocks, ...fixedBlocks, ...restBlocks, ...bufferBlocks].sort(compareBlocks);

  /* ---------- 第 9 步：硬约束校验 ---------- */
  const validation = validatePlanConstraints({
    plan: { blocks, sessionIds: blocks.filter((b) => b.kind === BLOCK_KIND.STUDY && b.refId).map((b) => b.refId) },
    tasks: state.tasks ?? [],
    sessions: state.sessions ?? [],
    fixedActivities: state.fixedActivities ?? [],
    settings: state.settings ?? {},
    now,
    policy,
    plannedMinutesByTask: remainingByTask,
    placedMinutesByTask: countPlacedMinutes(optimized),
  });

  for (const violation of validation.violations) {
    diagnostics.push({
      code: DIAGNOSTIC_CODE.RESERVED_BLOCK_OVERLAP,
      severity: 'error',
      constraint: violation.constraint,
      message: violation.message,
      relatedIds: violation.relatedIds,
    });
  }
  for (const warn of validation.warnings) {
    diagnostics.push({
      code: warn.constraint === CONSTRAINT.H4 ? DIAGNOSTIC_CODE.DEADLINE_LATE : DIAGNOSTIC_CODE.INPUT_WARNING,
      severity: 'warning',
      constraint: warn.constraint,
      message: warn.message,
      relatedIds: warn.relatedIds,
    });
  }

  if (!validation.ok) {
    // 硬约束被违反：绝不把这份计划当成可用结果交付给用户确认。
    // 这里把 blocks 一并带出，纯粹是为了让测试与诊断能直接看到"到底排成了什么样"。
    return {
      ok: false,
      status: PLAN_STATUS.INVALID_INPUT,
      reason: 'constraint_violation',
      blocksForDiagnostics: blocks,
      violations: validation.violations,
      diagnostics,
      unscheduled,
      inputHash,
      policyHash,
      taskById,
      policy,
      now,
      windowStart,
      windowEnd,
      windowDays,
      capacityDays,
      issues: validation.violations.map((violation) =>
        error(VALIDATION_CODES.ENTITY_OVERLAP, `engine.${violation.constraint}`, violation.message, violation.details),
      ),
    };
  }

  /* ---------- 第 10 步：可行性状态、风险与差异 ---------- */
  const placedTotal = placements.reduce((sum, placement) => sum + (placement.endMinutes - placement.startMinutes), 0);

  // 未安排的工作量（去掉已经排入的部分之后重新核账，保证报告的数字与计划一致）
  const finalUnscheduled = reconcileUnscheduled({
    unscheduled,
    remainingByTask,
    placements,
    taskById,
    now,
    policy,
  });

  const remainingAfter = [...remainingByTask.values()].reduce((sum, value) => sum + value, 0);
  const placedForActiveTasks = placements.reduce((sum, placement) => sum + (placement.endMinutes - placement.startMinutes), 0);

  let status = PLAN_STATUS.FEASIBLE;
  if (finalUnscheduled.length > 0) {
    status = placedForActiveTasks > 0 ? PLAN_STATUS.PARTIALLY_FEASIBLE : PLAN_STATUS.INFEASIBLE;
  }

  const overloadMinutes = computeOverload({ remainingByTask, capacityDays, placements });
  if (overloadMinutes > 0) {
    diagnostics.push({
      code: DIAGNOSTIC_CODE.OVERLOAD,
      severity: 'warning',
      message: `任务总需求超出七天窗口内的可用容量约 ${overloadMinutes} 分钟。系统不会通过取消机动缓冲来掩盖这个问题，请考虑延长学习时间或调整截止时间。`,
      details: { overloadMinutes },
    });
  }

  const days = buildDayMetrics({ capacityDays, blocks, placements, windowStart, windowEnd });

  const bufferReservedMinutes = bufferBlocks.reduce((sum, block) => sum + (block.endMinutes - block.startMinutes), 0);
  const restMinutes = restBlocks.reduce((sum, block) => sum + (block.endMinutes - block.startMinutes), 0);
  const studyMinutes = studyBlocks.reduce((sum, block) => sum + (block.endMinutes - block.startMinutes), 0);
  const reservedMinutesTotal = reservedBlocks.reduce((sum, block) => sum + (block.endMinutes - block.startMinutes), 0);

  const plan = {
    planId: input.planId ?? null,
    version: input.baseVersion ?? ((input.existingPlan?.version ?? 0) + 1),
    status,
    generatedAt: null, // 由调用方（服务层）填入真实时间：引擎保持纯函数，不读时钟
    windowStart,
    windowEnd,
    engineVersion: policy.engineVersion,
    policyHash,
    inputHash,
    blocks,
    sessionIds: blocks.filter((block) => block.kind === BLOCK_KIND.STUDY && block.refId).map((block) => block.refId),
    days,
    unscheduled: finalUnscheduled,
    diagnostics,
    metrics: {
      totalStudyMinutes: studyMinutes,
      totalReservedMinutes: reservedMinutesTotal,
      // 语义：**尚未安排**的剩余工作量合计（不是所有任务的剩余量，后者含已排入的部分）
      totalTaskRemainingMinutes: finalUnscheduled.reduce((sum, item) => sum + item.remainingMinutes, 0),
      totalRemainingWorkloadMinutes: remainingAfter,
      bufferReservedMinutes,
      restMinutes,
      subjectSwitches: countSubjectSwitches(studyBlocks),
      placedMinutes: placedTotal,
      overloadMinutes,
    },
  };

  const risks = assessAllRisks({
    tasks: state.tasks ?? [],
    remainingByTask,
    blocks,
    now,
    policy: { ...policy, studyWindows: state.settings?.studyWindows ?? {}, fixedSpans, reservedSpans },
    capacityDays,
  });

  if (plan.status !== PLAN_STATUS.FEASIBLE) {
    diagnostics.push({
      code: DIAGNOSTIC_CODE.OVERLOAD,
      severity: 'warning',
      message: `当前计划状态：${plan.status === PLAN_STATUS.INFEASIBLE ? '不可行' : '部分可行'}（${finalUnscheduled.length} 个任务未完全安排）。`,
    });
  }

  const diff = diffPlans(input.existingPlan ?? null, plan, { taskById });

  return {
    ok: true,
    status,
    plan,
    diagnostics,
    unscheduled: finalUnscheduled,
    risks,
    diff,
    taskById,
    policy,
    now,
    windowStart,
    windowEnd,
    windowDays,
    capacityDays,
    inputHash,
    policyHash,
    scoredEntries: orderedEntries.map((entry) => ({ taskId: entry.task.id, ...entry.score })),
    stats: {
      planned: remainingAfter,
      placed: placedForActiveTasks,
      schedulableMinutes: totalSchedulable,
      overloadMinutes,
    },
  };
}

/**
 * 计算一次排程的输入指纹（引擎内部与业务层共用同一个实现）。
 *
 * 抽出来的原因：服务层在"应用预览"时必须重新计算**当前状态**的指纹来检测预览过期。
 * 如果服务层自己再写一遍指纹逻辑，两边稍有差别（例如少算一个字段）就会出现
 * "数据明明变了、预览却还能应用"的漏洞。共用同一个函数可以彻底避免这种漂移。
 *
 * @param {object} params
 * @param {object} params.state 应用状态
 * @param {{date: string, minutes: number}} params.now
 * @param {string} params.windowStart
 * @param {string} params.windowEnd
 * @param {string} params.engineVersion
 * @param {Record<string, number>} [params.completedByTask] 每个任务的已完成分钟数
 */
function computeSchedulerInputHash({ state, now, windowStart, windowEnd, engineVersion, completedByTask }) {
  return computeInputHash({
    engineVersion,
    policyHash: computePolicyHash(state.settings ?? {}, engineVersion),
    nowDate: now.date,
    windowStart,
    windowEnd,
    settings: state.settings ?? {},
    tasks: state.tasks ?? [],
    sessions: state.sessions ?? [],
    fixedActivities: state.fixedActivities ?? [],
    completedMinutesByTask: completedByTask ?? {},
  });
}

/* ------------------------------------------------------------------ *
 * 辅助：输入非法
 * ------------------------------------------------------------------ */

function invalidResult({ now, windowStart, windowEnd, windowDays, policy, issues, state, baseVersion, existingPlan, taskById }) {
  return {
    ok: false,
    status: PLAN_STATUS.INVALID_INPUT,
    reason: 'invalid_input',
    issues,
    violations: [],
    diagnostics: issues.map((issue) => ({
      code: issue.code,
      severity: 'error',
      message: issue.message,
      path: issue.path,
    })),
    unscheduled: [],
    risks: [],
    diff: diffPlans(existingPlan ?? null, null, { taskById: taskById ?? new Map() }),
    policy,
    now,
    windowStart,
    windowEnd,
    windowDays,
    capacityDays: [],
    inputHash: null,
    policyHash: null,
    state,
    baseVersion,
  };
}

/* ------------------------------------------------------------------ *
 * 辅助：依赖门控
 * ------------------------------------------------------------------ */

/**
 * 找出被依赖阻断的任务。
 *
 * 规则（对应 H7 与需求"前置未完成不得提前执行"）：
 * - 前置任务被取消/删除 → 永远无法满足（DEPENDENCY_UNREACHABLE）
 * - 前置任务仍有剩余工作量、但本次窗口内排不下 → 本任务也无法可靠地"接在它之后"（BLOCKED_BY_DEPENDENCY）
 * - 前置任务可安排 → 不阻断（先后顺序由放位阶段的依赖检查保证）
 */
function collectDependencyBlocked(tasks, taskById, remainingByTask) {
  const blocked = new Map();
  const taskSet = new Set(tasks.map((task) => task.id));

  for (const task of tasks) {
    for (const dependencyId of task.dependsOn ?? []) {
      const dependency = taskById.get(dependencyId);
      if (!dependency) continue;
      if (dependency.status === 'completed') continue; // 前置任务已完成，不构阻断

      if (dependency.status === 'cancelled' || dependency.status === 'deleted') {
        blocked.set(task.id, {
          reasonCode: UNSCHEDULED_REASON.DEPENDENCY_UNREACHABLE,
          extra: { dependencyId, dependencyTitle: dependency.title },
        });
        break;
      }
      if (!taskSet.has(dependencyId)) {
        // 前置任务本身不在可排程集合里（例如已取消）→ 同样无法满足
        blocked.set(task.id, {
          reasonCode: UNSCHEDULED_REASON.DEPENDENCY_UNREACHABLE,
          extra: { dependencyId, dependencyTitle: dependency.title },
        });
        break;
      }
      if ((remainingByTask.get(dependencyId) ?? 0) <= 0) continue; // 已完成，不阻断
    }
  }
  return blocked;
}

/* ------------------------------------------------------------------ *
 * 辅助：未安排原因
 * ------------------------------------------------------------------ */

function reasonCodeForSplitStatus(status) {
  switch (status) {
    case SPLIT_STATUS.ATOMIC_TOO_LONG:
      return UNSCHEDULED_REASON.NON_SPLITTABLE_NO_SLOT;
    case SPLIT_STATUS.UNSPLITTABLE_TAIL:
      return UNSCHEDULED_REASON.TAIL_TOO_SMALL;
    case SPLIT_STATUS.TOO_MANY_FRAGMENTS:
      return UNSCHEDULED_REASON.TAIL_TOO_SMALL;
    default:
      return UNSCHEDULED_REASON.INSUFFICIENT_CAPACITY;
  }
}

function buildUnscheduled({ task, remainingMinutes, reasonCode, extra = {} }) {
  return {
    taskId: task.id,
    taskTitle: task.title,
    subject: task.subject,
    remainingMinutes,
    gapMinutes: remainingMinutes,
    reasonCode,
    reasonText: extra.message ?? describeReason(reasonCode),
    details: { ...extra, deadlineDate: task.deadlineDate, deadlineTime: task.deadlineTime },
    suggestions: suggestFor(reasonCode),
  };
}

function describeReason(reasonCode) {
  const texts = {
    [UNSCHEDULED_REASON.INSUFFICIENT_CAPACITY]: '七天窗口内的可用学习容量不足，放不下剩余的全部工作量。',
    [UNSCHEDULED_REASON.TAIL_TOO_SMALL]: '剩余的尾部时长小于该任务的最短学习时段，无法作为一个合法时段安排。',
    [UNSCHEDULED_REASON.BLOCKED_BY_DEPENDENCY]: '前置任务尚未完成，因此不能提前安排。',
    [UNSCHEDULED_REASON.DEPENDENCY_UNREACHABLE]: '前置任务已被取消或删除，该任务永远无法满足依赖条件。',
    [UNSCHEDULED_REASON.NON_SPLITTABLE_NO_SLOT]: '该任务不可拆分，但窗口内没有足够长的连续空闲时段一次放下。',
    [UNSCHEDULED_REASON.DEADLINE_PASSED]: '截止时间已经过去，安排也无法按时完成。',
    [UNSCHEDULED_REASON.WINDOW_TOO_NARROW]: '允许学习的时间窗口为空或过窄。',
    [UNSCHEDULED_REASON.DAILY_CAP_REACHED]: '已触达每日学习上限或每日片段数上限。',
    [UNSCHEDULED_REASON.OVERLOADED]: '所有任务的剩余工作量之和超过了窗口内的可用容量。',
  };
  return texts[reasonCode] ?? '在当前约束下无法安排。';
}

function suggestFor(reasonCode) {
  const map = {
    [UNSCHEDULED_REASON.INSUFFICIENT_CAPACITY]: ['extend_window', 'accept_partial', 'lower_buffer', 'move_deadline'],
    [UNSCHEDULED_REASON.TAIL_TOO_SMALL]: ['lower_min_chunk', 'merge_chunks', 'move_deadline'],
    [UNSCHEDULED_REASON.BLOCKED_BY_DEPENDENCY]: ['finish_dependency', 'remove_dependency'],
    [UNSCHEDULED_REASON.DEPENDENCY_UNREACHABLE]: ['remove_dependency', 'restore_dependency', 'cancel_task'],
    [UNSCHEDULED_REASON.NON_SPLITTABLE_NO_SLOT]: ['allow_split', 'extend_window', 'move_deadline'],
    [UNSCHEDULED_REASON.DEADLINE_PASSED]: ['move_deadline', 'cancel_task'],
    [UNSCHEDULED_REASON.WINDOW_TOO_NARROW]: ['extend_window'],
    [UNSCHEDULED_REASON.DAILY_CAP_REACHED]: ['raise_daily_cap', 'extend_window'],
    [UNSCHEDULED_REASON.OVERLOADED]: ['accept_partial', 'extend_window', 'move_deadline', 'cancel_task'],
  };
  return map[reasonCode] ?? ['accept_partial'];
}

/* ------------------------------------------------------------------ *
 * 辅助：片段 ID 与用量
 * ------------------------------------------------------------------ */

/**
 * 把学习片段的 ID 改写为"(任务, 片段序号)"派生的确定性 ID。
 *
 * 注意两个坑：
 * 1. 休息块没有 taskId，必须原样保留（kind='rest'），否则会被下游当成学习块统计。
 * 2. 早期版本用 `placements.length` 当作片段序号，会导致同一任务的多个片段拿到**相同的 ID**，
 *    进而在硬约束校验里被当成"两个重叠的学习时段"。序号必须按任务单独计数。
 */
function reassignSessionIds(placements, fragmentsByTask, inputHash) {
  const counterByTask = new Map();
  return placements.map((placement) => {
    if (placement.kind === 'rest') return { ...placement, kind: 'rest' };
    if (placement.kind === 'study') {
      const index = counterByTask.get(placement.taskId) ?? 0;
      counterByTask.set(placement.taskId, index + 1);
      return { ...placement, kind: 'study', taskId: placement.taskId, id: deriveSessionId(inputHash, placement.taskId, index) };
    }
    return { ...placement, kind: placement.kind ?? 'study' };
  });
}

function countPlacedMinutes(placements) {
  const map = new Map();
  for (const placement of placements) {
    if (placement.kind !== 'study') continue;
    map.set(placement.taskId, (map.get(placement.taskId) ?? 0) + (placement.endMinutes - placement.startMinutes));
  }
  return map;
}

/** 核账：只保留真正没有被排入的分钟数，避免报告与计划不一致 */
function reconcileUnscheduled({ unscheduled, remainingByTask, placements, taskById, now, policy }) {
  const placed = countPlacedMinutes(placements);
  const byTask = new Map();
  for (const item of unscheduled) {
    if (!byTask.has(item.taskId)) byTask.set(item.taskId, item);
  }

  const out = [];
  for (const [taskId, remaining] of remainingByTask) {
    if (remaining <= 0) continue;
    const placedMinutes = placed.get(taskId) ?? 0;
    const missing = remaining - placedMinutes;
    if (missing <= 0) continue;
    const task = taskById.get(taskId);
    if (!task) continue;
    const existing = byTask.get(taskId);
    if (existing) {
      out.push({ ...existing, remainingMinutes: missing, gapMinutes: missing });
    } else {
      const reasonCode = pickReasonCode({ task, missing, policy });
      out.push({
        taskId,
        taskTitle: task.title,
        subject: task.subject,
        remainingMinutes: missing,
        gapMinutes: missing,
        reasonCode,
        reasonText: describeReason(reasonCode),
        details: { deadlineDate: task.deadlineDate, deadlineTime: task.deadlineTime },
        suggestions: suggestFor(reasonCode),
      });
    }
  }

  return out.sort((a, b) => (a.taskId < b.taskId ? -1 : 1));
}

function pickReasonCode({ task, missing, policy }) {
  if (task.splittable === false) return UNSCHEDULED_REASON.NON_SPLITTABLE_NO_SLOT;
  const minChunk = task.minChunkMinutes ?? policy.defaultMinChunkMinutes;
  if (missing < minChunk) return UNSCHEDULED_REASON.TAIL_TOO_SMALL;
  return UNSCHEDULED_REASON.INSUFFICIENT_CAPACITY;
}

/* ------------------------------------------------------------------ *
 * 辅助：局部优化
 * ------------------------------------------------------------------ */

/**
 * 局部优化：只做两类**可验证、可回退**的移动。
 *
 * 1. 把片段向前挪到当日更早的空位（减少白天碎片、让安排紧凑）。
 * 2. 把同一天里"同科目"的片段往相邻位置合并（减少科目切换）。
 *
 * 每次移动后都会重新检查硬约束（H1/H2/H3/H7），只要违反就立刻回退。
 * 迭代次数有上界（策略里的 optimizationPasses），因此结果是确定的、有界的。
 * **不宣称全局最优**：这里只是一个局部改进，UI 与文档的说法必须与此一致。
 */
function optimizePlacements({ placements, policy, occupiedSpans, studyWindows, taskById, passes }) {
  let current = dedupePlacements(placements);
  const passesToRun = Math.max(0, Math.min(passes ?? policy.optimizationPasses, 5));

  for (let pass = 0; pass < passesToRun; pass += 1) {
    // 占用集合必须包含**同一天的休息块**：休息也是真实占用时间轴的时间，
    // 只考虑保留时段与固定活动会让"向前压缩"把学习片段挪到休息上（H2/H8 违规）。
    const restSpans = current.filter((item) => item.kind === 'rest');
    const improved = tryCompact(current, {
      occupiedSpans: [...occupiedSpans, ...restSpans],
      studyWindows,
      taskById,
    });
    if (!improved.changed) break;
    current = improved.placements;
  }

  const sorted = current.sort(
    (a, b) =>
      (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) ||

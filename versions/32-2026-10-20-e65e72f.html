<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>七天学习规划器（单文件版）</title>
<meta name="description" content="纯本地运行的七天学习规划器单文件版本，可直接双击打开。" />
<style>
/* ==========================================================================
   设计令牌（Design Tokens）
   所有颜色、间距、字号都集中在这里，禁止在其它样式文件中写死颜色值。
   这样将来要加深色主题或调整视觉风格时，只需要改这一个文件。
   ========================================================================== */

:root {
  /* —— 颜色：以"安静的学习工具"为目标，避免高饱和与大面积渐变 —— */
  --color-bg: #f6f7f9;
  --color-surface: #ffffff;
  --color-surface-alt: #f1f3f6;
  --color-border: #dfe3e8;
  --color-border-strong: #c3cad3;

  --color-text: #1c2430;
  --color-text-muted: #5b6675;
  --color-text-faint: #8a94a3;

  --color-primary: #2f6fd0;
  --color-primary-hover: #265bb0;
  --color-primary-soft: #e8f0fb;

  --color-study: #2f6fd0; /* 学习时段 */
  --color-study-soft: #dce9fa;
  --color-fixed: #8a94a3; /* 固定活动 */
  --color-fixed-soft: #edeff2;
  --color-rest: #3f9e7f; /* 计划休息 */
  --color-rest-soft: #dcefe8;
  --color-accent: #b8912f; /* 强调色（用于图表与统计磁贴） */
  --color-accent-soft: #f6eed8;
  --color-locked: #6b4fd0; /* 已锁定 */
  --color-locked-soft: #e7e1fa;

  --color-danger: #c0392b;
  --color-danger-soft: #fbe9e7;
  --color-warning: #a9720f;
  --color-warning-soft: #fdf3dd;
  --color-success: #2f7d55;
  --color-success-soft: #e3f2ea;

  /* —— 间距 —— */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  /* —— 字体 —— */
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
    'Helvetica Neue', Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  --font-size-xs: 12px;
  --font-size-sm: 13px;
  --font-size-base: 14px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 26px;

  /* —— 圆角与阴影：少量、克制 —— */
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(28, 36, 48, 0.06);
  --shadow-md: 0 2px 8px rgba(28, 36, 48, 0.08);

  /* —— 布局尺寸 —— */
  --sidebar-width: 208px;
  --topbar-height: 56px;
  /* 七天计划看板的尺寸基准：5 分钟 = 一个标准格 */
  --day-grid-step: 8px;
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}

/* ==========================================================================
   主题：浅色 / 深色 / 跟随系统
   规则：语义色一律通过令牌访问，任何组件都不得写死颜色。
   深色主题只需重定义下面这些变量，所有页面、弹窗、输入框、日历与图表会自动适配。
   ========================================================================== */

/* 显式选择的深色主题 */
:root[data-theme='dark'] {
  color-scheme: dark;

  --color-bg: #12161c;
  --color-surface: #1a1f27;
  --color-surface-alt: #222833;
  --color-border: #2e3641;
  --color-border-strong: #435062;

  --color-text: #e8edf4;
  --color-text-muted: #a7b2c1;
  --color-text-faint: #7b8798;

  --color-primary: #6ba4f0;
  --color-primary-hover: #8ab8f5;
  --color-primary-soft: #1e2c42;

  --color-study: #6ba4f0;
  --color-study-soft: #1e2c42;
  --color-fixed: #8b97a8;
  --color-fixed-soft: #262d38;
  --color-rest: #4fbf9a;
  --color-rest-soft: #172f28;
  --color-accent: #d6ae4e;
  --color-accent-soft: #302818;
  --color-locked: #9c85ee;
  --color-locked-soft: #251f3d;

  --color-danger: #f0776a;
  --color-danger-soft: #37201d;
  --color-warning: #e0b357;
  --color-warning-soft: #332a17;
  --color-success: #5cbd8b;
  --color-success-soft: #172e23;

  /* 深色下阴影要更重，否则卡片会"浮"不起来 */
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
}

/* 跟随系统：仅在用户没有显式选择浅/深色时生效 */
@media (prefers-color-scheme: dark) {
  :root[data-theme='system'],
  :root:not([data-theme]) {
    color-scheme: dark;

    --color-bg: #12161c;
    --color-surface: #1a1f27;
    --color-surface-alt: #222833;
    --color-border: #2e3641;
    --color-border-strong: #435062;

    --color-text: #e8edf4;
    --color-text-muted: #a7b2c1;
    --color-text-faint: #7b8798;

    --color-primary: #6ba4f0;
    --color-primary-hover: #8ab8f5;
    --color-primary-soft: #1e2c42;

    --color-study: #6ba4f0;
    --color-study-soft: #1e2c42;
    --color-fixed: #8b97a8;
    --color-fixed-soft: #262d38;
    --color-rest: #4fbf9a;
    --color-rest-soft: #172f28;
    --color-accent: #d6ae4e;
    --color-accent-soft: #302818;
    --color-locked: #9c85ee;
    --color-locked-soft: #251f3d;

    --color-danger: #f0776a;
    --color-danger-soft: #37201d;
    --color-warning: #e0b357;
    --color-warning-soft: #332a17;
    --color-success: #5cbd8b;
    --color-success-soft: #172e23;

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.45);
  }
}

/* ==========================================================================
   自定义壁纸
   ==========================================================================

   层级关系（这里曾经出过一个严重问题，改动前请先读完）：

   `#app-wallpaper` 必须用**负的 z-index**（-1）。
   定位元素若写成 z-index: 0，按 CSS 绘制顺序它会画在**普通流内容之上**——
   于是整页会被壁纸和遮罩糊住：文字发蒙、部分区块看不见、点击也会被盖住。
   负 z-index 才会落到"内容之下、页面背景之上"的正确位置，而且不需要给
   任何业务元素加 z-index。

   另外：
   - 壁纸层不接收鼠标事件（pointer-events: none），不参与无障碍树；
   - **不再对卡片使用 backdrop-filter / 半透明底色**。
     那是"整个界面发蒙"的第二个原因：模糊作用在了承载文字的容器上。
     壁纸只作为背景，前景一律保持不透明，保证任何照片下文字都清晰。
*/

#app-wallpaper {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-repeat: no-repeat;
  background-position: center;
  background-size: cover;
}

/* 遮罩：把壁纸压暗/压淡，保证与前景的对比度。数值固定，不提供调节。 */
#app-wallpaper::after {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--color-bg);
  opacity: 0.62;
}

/* 有壁纸时，页面容器透明，让壁纸透出来；卡片本身保持不透明以承载文字 */
:root[data-wallpaper='on'] .app,
:root[data-wallpaper='on'] .app-main {
  background: transparent;
}


/* ==========================================================================
   基础样式：重置、排版、可访问性（焦点、对比度、键盘操作）
   ========================================================================== */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--font-size-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-weight: 600;
  line-height: 1.35;
}

h1 {
  font-size: var(--font-size-xl);
}
h2 {
  font-size: var(--font-size-lg);
}
h3 {
  font-size: var(--font-size-md);
}

p {
  margin: 0 0 var(--space-3);
}

a {
  color: var(--color-primary);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

ul,
ol {
  margin: 0;
  padding-left: 1.2em;
}

/* —— 键盘可达性：任何可聚焦元素都要有清晰轮廓 —— */
:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* —— 屏幕阅读器专用文本（用于图标按钮的可访问名称） —— */
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* —— 跳转到主内容（键盘用户的第一个焦点） —— */
.skip-link {
  position: absolute;
  left: var(--space-3);
  top: -48px;
  z-index: 100;
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  transition: top 0.15s ease;
}
.skip-link:focus {
  top: var(--space-3);
}

/* —— 表单元素：统一外观，避免浏览器默认样式造成的不一致 —— */
input,
select,
textarea,
button {
  font: inherit;
  color: inherit;
}

input[type='text'],
input[type='number'],
input[type='date'],
input[type='time'],
select,
textarea {
  width: 100%;
  padding: var(--space-2) var(--space-3);
  background: var(--color-surface);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  color: var(--color-text);
}

input:disabled,
select:disabled,
textarea:disabled {
  background: var(--color-surface-alt);
  color: var(--color-text-faint);
}

label {
  display: block;
  font-size: var(--font-size-sm);
  font-weight: 500;
  color: var(--color-text-muted);
  margin-bottom: var(--space-1);
}

/* —— 表格：只在真正是表格数据时使用 —— */
table {
  border-collapse: collapse;
  width: 100%;
}
th,
td {
  text-align: left;
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--color-border);
}
th {
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
  font-weight: 600;
}

/* —— 滚动条：细一点，减少视觉噪音 —— */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--color-border-strong) transparent;
}
*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
*::-webkit-scrollbar-thumb {
  background: var(--color-border-strong);
  border-radius: 6px;
  border: 2px solid var(--color-bg);
}


/* ==========================================================================
   布局与组件样式
   命名约定：块级用 .app- / .card / .btn / .pill / .state；修饰用 -modifier。
   所有颜色与间距都引用 tokens.css 中的变量。
   ========================================================================== */

/* —— 应用外壳 —— */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr;
  grid-template-rows: var(--topbar-height) 1fr;
  grid-template-areas:
    'brand topbar'
    'nav   main';
  min-height: 100vh;
}

.app-brand {
  grid-area: brand;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0 var(--space-4);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  border-bottom: 1px solid var(--color-border);
  font-weight: 600;
  letter-spacing: 0.01em;
}
.app-brand__mark {
  width: 20px;
  height: 20px;
  border-radius: var(--radius-sm);
  background: var(--color-primary);
  flex: none;
}

.app-topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: 0 var(--space-5);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
}
.app-topbar__meta {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}
.app-topbar__actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.app-nav {
  grid-area: nav;
  padding: var(--space-4) var(--space-3);
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}
.app-nav__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.app-nav__link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  font-weight: 500;
}
.app-nav__link:hover {
  background: var(--color-surface-alt);
  color: var(--color-text);
  text-decoration: none;
}
.app-nav__link[aria-current='page'] {
  background: var(--color-primary-soft);
  color: var(--color-primary-hover);
}
.app-nav__key {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 0 4px;
  font-variant-numeric: tabular-nums;
}

.app-nav__foot {
  margin-top: auto;
  border-top: 1px solid var(--color-border);
  padding-top: var(--space-3);
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.app-main {
  grid-area: main;
  padding: var(--space-5) var(--space-5) var(--space-7);
  min-width: 0;
}

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-4);
}
.page-head__sub {
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
  margin-top: var(--space-1);
}
.page-head__actions {
  display: flex;
  gap: var(--space-2);
  flex: none;
}

/* —— 卡片 —— */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  margin-bottom: var(--space-4);
}
.card--flush {
  padding: 0;
  overflow: hidden;
}
.card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.card__title {
  font-size: var(--font-size-md);
  font-weight: 600;
}
.card__hint {
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--space-4);
}

/* —— 按钮 —— */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border: 1px solid var(--color-border-strong);
  border-radius: var(--radius-md);
  background: var(--color-surface);
  color: var(--color-text);
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover:not(:disabled) {
  background: var(--color-surface-alt);
}
.btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.btn--primary {
  background: var(--color-primary);
  border-color: var(--color-primary);
  color: #fff;
}
.btn--primary:hover:not(:disabled) {
  background: var(--color-primary-hover);
  border-color: var(--color-primary-hover);
}
.btn--danger {
  border-color: var(--color-danger);
  color: var(--color-danger);
  background: var(--color-surface);
}
.btn--danger:hover:not(:disabled) {
  background: var(--color-danger-soft);
}
.btn--ghost {
  border-color: transparent;
  background: transparent;
  color: var(--color-text-muted);
}
.btn--ghost:hover:not(:disabled) {
  background: var(--color-surface-alt);
  color: var(--color-text);
}
.btn--sm {
  padding: var(--space-1) var(--space-3);
  font-size: var(--font-size-sm);
}

/* —— 状态标签 —— */
.pill {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 1px var(--space-2);
  border-radius: 999px;
  font-size: var(--font-size-xs);
  font-weight: 500;
  border: 1px solid transparent;
  white-space: nowrap;
}
.pill--neutral {
  background: var(--color-surface-alt);
  color: var(--color-text-muted);
  border-color: var(--color-border);
}
.pill--study {
  background: var(--color-study-soft);
  color: var(--color-study);
}
.pill--fixed {
  background: var(--color-fixed-soft);
  color: var(--color-text-muted);
}
.pill--rest {
  background: var(--color-rest-soft);
  color: var(--color-rest);
}
.pill--locked {
  background: var(--color-locked-soft);
  color: var(--color-locked);
}
.pill--warning {
  background: var(--color-warning-soft);
  color: var(--color-warning);
}
.pill--danger {
  background: var(--color-danger-soft);
  color: var(--color-danger);
}
.pill--success {
  background: var(--color-success-soft);
  color: var(--color-success);
}

/* —— 提示条 / 空状态 / 错误状态 —— */
.notice {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  background: var(--color-surface-alt);
  margin-bottom: var(--space-4);
}
.notice__title {
  font-weight: 600;
  margin-bottom: var(--space-1);
}
.notice--info {
  background: var(--color-primary-soft);
  border-color: #cfe0f7;
}
.notice--warning {
  background: var(--color-warning-soft);
  border-color: #f0e0b6;
}
.notice--danger {
  background: var(--color-danger-soft);
  border-color: #f2cfc9;
}
.notice--success {
  background: var(--color-success-soft);
  border-color: #cbe6d8;
}

.state {
  text-align: center;
  padding: var(--space-6) var(--space-4);
  border: 1px dashed var(--color-border-strong);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  color: var(--color-text-muted);
}
.state__title {
  font-size: var(--font-size-md);
  font-weight: 600;
  color: var(--color-text);
  margin-bottom: var(--space-2);
}
.state__actions {
  margin-top: var(--space-4);
  display: flex;
  gap: var(--space-2);
  justify-content: center;
}

/* —— 数据摘要（避免无意义的大数字卡片堆砌，只保留必要的每日统计） —— */
.metric-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  align-items: baseline;
}
.metric {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 96px;
}
.metric__label {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}
.metric__value {
  font-size: var(--font-size-md);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* —— 图例 —— */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}
.legend__item {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
}
.legend__swatch {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  border: 1px solid var(--color-border-strong);
}

/* —— 任务列表 —— */
.task-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
}
.task-item {
  padding: var(--space-3) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.task-item:last-child {
  border-bottom: none;
}
.task-item__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
}
.task-item__title {
  font-weight: 600;
}
.task-item__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  align-items: center;
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}
.task-item__actions {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

/* —— 表单 —— */
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-4);
}
.form-field {
  display: flex;
  flex-direction: column;
}
.form-field--full {
  grid-column: 1 / -1;
}
.form-field__hint {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  margin-top: var(--space-1);
}
.form-field__error {
  font-size: var(--font-size-xs);
  color: var(--color-danger);
  margin-top: var(--space-1);
}
.form-actions {
  display: flex;
  gap: var(--space-2);
  justify-content: flex-end;
  margin-top: var(--space-4);
}
fieldset {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4) var(--space-4);
  margin: 0 0 var(--space-4);
}
legend {
  padding: 0 var(--space-2);
  font-weight: 600;
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
}

/* —— 可聚焦的横向滚动区域（七天看板）—— */
.day-board:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 2px;
}

/* —— 屏幕阅读器专用提示 —— */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* —— 表格型列表（版本历史） —— */
.table-wrap {
  overflow-x: auto;
}

/* —— 诊断列表（未安排原因、冲突与风险） —— */
.diag-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.diag-item {
  display: flex;
  gap: var(--space-2);
  align-items: flex-start;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-alt);
  font-size: var(--font-size-sm);
}
.diag-item__code {
  font-family: var(--font-mono);
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  flex: none;
}

/* —— 窄屏适配：侧边栏收起为顶部标签，网格变单列 —— */
@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto 1fr;
    grid-template-areas:
      'brand'
      'nav'
      'main';
  }
  .app-topbar {
    grid-area: brand;
    border-bottom: 1px solid var(--color-border);
  }
  .app-brand {
    display: none;
  }
  .app-nav {
    flex-direction: row;
    overflow-x: auto;
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    padding: var(--space-2) var(--space-3);
    gap: var(--space-3);
  }
  .app-nav__list {
    flex-direction: row;
    gap: var(--space-1);
  }
  .app-nav__key {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: 0 4px;
  font-variant-numeric: tabular-nums;
}

.app-nav__foot {
    margin-top: 0;
    border-top: none;
    padding-top: 0;
    flex-direction: row;
    align-items: center;
    gap: var(--space-2);
    white-space: nowrap;
  }
  .app-main {
    padding: var(--space-4);
  }
  .grid-2,
  .grid-3,
  .form-grid {
    grid-template-columns: 1fr;
  }
}

/* ==========================================================================
   首页、统计与进度组件
   ========================================================================== */

/* —— 首页主视觉 —— */
.home-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--space-5);
  flex-wrap: wrap;
  padding: var(--space-5);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, var(--color-primary-soft), var(--color-surface));
  border: 1px solid var(--color-border);
  box-shadow: var(--shadow-sm);
}

.home-hero__date {
  margin: 0 0 var(--space-1);
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}

.home-hero__title {
  margin: 0 0 var(--space-2);
  font-size: var(--font-size-xl);
  line-height: 1.25;
}

.home-hero__sub {
  margin: 0;
  color: var(--color-text-muted);
  max-width: 60ch;
}

.home-hero__actions {
  display: flex;
  gap: var(--space-2);
  flex-wrap: wrap;
}

/* —— 统计磁贴 —— */
.home-tiles,
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: var(--space-3);
}

.stat-tile {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  padding: var(--space-4);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  box-shadow: var(--shadow-sm);
  text-align: left;
}

.stat-tile--button {
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
}

.stat-tile--button:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
  border-color: var(--color-border-strong);
}

.stat-tile__label {
  font-size: var(--font-size-sm);
  color: var(--color-text-muted);
}

.stat-tile__value {
  font-size: var(--font-size-lg);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.stat-tile__hint {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
}

/* —— 进度条 —— */
.progress {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-top: var(--space-2);
}

.progress__head {
  display: flex;
  justify-content: space-between;
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

.progress__value {
  font-variant-numeric: tabular-nums;
}

.progress__track {
  height: 6px;
  border-radius: 999px;
  background: var(--color-surface-alt);
  overflow: hidden;
}

.progress__fill {
  height: 100%;
  border-radius: 999px;
  background: var(--color-primary);
  transition: width 240ms ease;
}

.progress__fill--rest { background: var(--color-rest); }
.progress__fill--accent { background: var(--color-accent); }
.progress__fill--locked { background: var(--color-locked); }
.progress__fill--danger { background: var(--color-danger); }

.progress__hint {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
}

/* —— 首页两列布局 —— */
.home-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: var(--space-4);
  align-items: start;
}

.home-grid__main,
.home-grid__side {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  min-width: 0;
}

@media (max-width: 1080px) {
  .home-grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* —— 下一项学习 —— */
.home-next__task {
  margin-bottom: var(--space-2);
}

.home-next__title {
  font-size: var(--font-size-md);
  font-weight: 600;
}

.home-next__meta {
  color: var(--color-text-muted);
  font-size: var(--font-size-sm);
}

/* —— 最近七天迷你柱状图 —— */
.week-bars {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: var(--space-2);
  align-items: end;
  height: 132px;
}

.week-bars__col {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  height: 100%;
}

.week-bars__bars {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 3px;
  height: 100%;
}

.week-bars__bar {
  width: 12px;
  min-height: 2px;
  border-radius: 3px 3px 0 0;
  transition: height 240ms ease;
}

.week-bars__bar--planned {
  background: var(--color-primary-soft);
  border: 1px solid var(--color-primary);
}

.week-bars__bar--actual {
  background: var(--color-primary);
}

.week-bars__label {
  text-align: center;
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

/* —— 占比条 —— */
.share-bars {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.share-bars__head {
  display: flex;
  justify-content: space-between;
  font-size: var(--font-size-sm);
  margin-bottom: var(--space-1);
}

.share-bars__value {
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}

.share-bars__track {
  height: 8px;
  border-radius: 999px;
  background: var(--color-surface-alt);
  overflow: hidden;
}

.share-bars__fill {
  height: 100%;
  border-radius: 999px;
  background: var(--color-primary);
}

.share-bars__fill--rest { background: var(--color-rest); }
.share-bars__fill--accent { background: var(--color-accent); }
.share-bars__fill--locked { background: var(--color-locked); }

/* —— 柱状图 —— */
.chart-figure {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.chart-figure__axis {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

.chart {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 6px;
  align-items: end;
  padding-bottom: 2px;
  border-bottom: 1px solid var(--color-border);
}

.chart__col {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  height: 100%;
  gap: 4px;
  min-width: 0;
}

/* 计划时长：同一列背后的浅色轨道（与实际柱同一坐标，不并列） */
.chart__track {
  position: absolute;
  bottom: 18px;
  width: 68%;
  border-radius: 4px 4px 0 0;
  background: var(--color-surface-alt);
  border: 1px dashed var(--color-border-strong);
  box-sizing: border-box;
  z-index: 0;
}

.chart__bar {
  position: relative;
  z-index: 1;
  width: 58%;
  min-height: 2px;
  border-radius: 4px 4px 0 0;
  background: var(--color-primary);
  transition: height 260ms ease;
}

/* 当天没有任何已完成学习：一条基线短划，与"没有数据"区分开 */
.chart__zero {
  width: 58%;
  height: 2px;
  margin-bottom: 0;
  border-radius: 1px;
  background: var(--color-border-strong);
  z-index: 1;
}

.chart__label {
  height: 16px;
  font-size: 10px;
  line-height: 16px;
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.chart-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-3);
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

.chart-legend__item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.chart-legend__swatch {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}

.chart-legend__swatch--bar { background: var(--color-primary); }
.chart-legend__swatch--track { background: var(--color-surface-alt); border: 1px dashed var(--color-border-strong); }
.chart-legend__swatch--zero { background: var(--color-border-strong); height: 2px; }

.chart__label {
  text-align: center;
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
}

/* —— 完成的清单项 —— */
.task-item--done {
  opacity: 0.68;
}

.task-item--done strong {
  text-decoration: line-through;
}

/* ==========================================================================
   主题选项、转盘、番茄钟、通知列表
   ========================================================================== */

/* —— 主题选项卡片 —— */
.theme-options {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-3);
}

.theme-option {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-4);
  border: 2px solid var(--color-border);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  cursor: pointer;
  font: inherit;
  color: inherit;
  text-align: left;
  transition: border-color 140ms ease, transform 140ms ease;
}

.theme-option:hover {
  transform: translateY(-1px);
  border-color: var(--color-border-strong);
}

.theme-option.is-active {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 3px var(--color-primary-soft);
}

.theme-option__preview {
  display: flex;
  gap: 6px;
  height: 44px;
  padding: 8px;
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
}

.theme-option__preview--light { background: #f6f7f9; }
.theme-option__preview--dark { background: #12161c; }
.theme-option__preview--system { background: linear-gradient(90deg, #f6f7f9 50%, #12161c 50%); }

.theme-option__swatch {
  flex: 1;
  border-radius: var(--radius-sm);
}

.theme-option__preview--light .theme-option__swatch:nth-child(1) { background: #2f6fd0; }
.theme-option__preview--light .theme-option__swatch:nth-child(2) { background: #ffffff; border: 1px solid #dfe3e8; }
.theme-option__preview--light .theme-option__swatch:nth-child(3) { background: #3f9e7f; }

.theme-option__preview--dark .theme-option__swatch:nth-child(1) { background: #6ba4f0; }
.theme-option__preview--dark .theme-option__swatch:nth-child(2) { background: #1a1f27; border: 1px solid #2e3641; }
.theme-option__preview--dark .theme-option__swatch:nth-child(3) { background: #4fbf9a; }

.theme-option__preview--system .theme-option__swatch { background: rgba(47, 111, 208, 0.65); }

.theme-option__name {
  font-weight: 600;
}

.theme-option__desc {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
}

/* —— 滑块行 —— */
.slider-row {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.slider-row input[type='range'] {
  flex: 1;
  accent-color: var(--color-primary);
}


/* ==========================================================================
   响应式：手机与窄屏
   桌面是"左侧栏 + 主区"的两列布局；窄屏改为单列纵向堆叠，
   导航变成可横向滚动的一行，保证任何屏幕宽度下都能操作与阅读。
   ========================================================================== */

@media (max-width: 900px) {
  .app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto minmax(0, 1fr);
    grid-template-areas:
      'brand'
      'topbar'
      'nav'
      'main';
  }

  .app-brand {
    border-right: none;
    border-bottom: 1px solid var(--color-border);
  }

  .app-topbar {
    border-left: none;
    border-bottom: 1px solid var(--color-border);
    flex-wrap: wrap;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
  }

  /* 导航改为横向滚动的标签条：不用汉堡菜单也能一键直达任意页面 */
  .app-nav {
    padding: var(--space-2) var(--space-3);
    border-right: none;
    border-bottom: 1px solid var(--color-border);
    gap: var(--space-2);
    overflow-x: auto;
  }

  .app-nav__list {
    flex-direction: row;
    gap: var(--space-1);
    min-width: max-content;
  }

  .app-nav__link {
    white-space: nowrap;
    padding: var(--space-2) var(--space-3);
  }

  /* 窄屏下快捷键数字没有意义，隐藏以免占用宽度 */
  .app-nav__key {
    display: none;
  }

  .app-main {
    padding: var(--space-3);
  }

  /* 表格在窄屏允许横向滚动，而不是把内容压变形 */
  .table-wrap {
    overflow-x: auto;
  }

  .home-hero {
    padding: var(--space-4);
  }

  .home-hero__actions {
    width: 100%;
  }

  .home-hero__actions .btn {
    flex: 1 1 auto;
  }
}

@media (max-width: 560px) {
  .metric-row {
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  }

  .home-tiles,
  .stat-grid {
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  }

  .card {
    padding: var(--space-3);
  }

  .task-item__head {
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-2);
  }

  .task-item__actions {
    width: 100%;
    flex-wrap: wrap;
  }
}

/* ==========================================================================
   每日视图：日期为列、任务为内容
   ========================================================================== */

.day-board {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(180px, 1fr);
  gap: var(--space-3);
  padding: var(--space-4);
  overflow-x: auto;
  align-items: start;
}

/* 窄屏允许横向滚动，保证卡片不会被压扁或重叠 */
@media (max-width: 900px) {
  .day-board {
    grid-auto-columns: minmax(160px, 1fr);
    padding: var(--space-3);
  }
}

.day-board__col {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-width: 0;
  padding: var(--space-2);
  border-radius: var(--radius-md);
  background: var(--color-surface-alt);
  border: 1px solid transparent;
}

.day-board__col.is-today {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.day-board__head {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: 0 var(--space-1) var(--space-1);
  border-bottom: 1px solid var(--color-border);
  flex-wrap: wrap;
}

.day-board__date {
  font-weight: 650;
  font-size: var(--font-size-sm);
}

.day-board__num {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}

.day-board__badge {
  font-size: var(--font-size-xs);
  color: var(--color-primary);
  border: 1px solid var(--color-primary);
  border-radius: 999px;
  padding: 0 6px;
  margin-left: auto;
}

.day-board__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-height: 40px;
}

.day-board__empty {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  padding: var(--space-2);
  text-align: center;
}

/* —— 任务卡片 —— */
.day-card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  border: 1px solid var(--color-border);
  border-left: 3px solid var(--color-border-strong);
  background: var(--color-surface);
  text-align: left;
  font: inherit;
  color: inherit;
}

.day-card--study {
  border-left-color: var(--color-study);
  cursor: pointer;
  transition: box-shadow 120ms ease, transform 120ms ease;
}

.day-card--study:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.day-card--study:focus-visible {
  outline: 2px solid var(--color-primary);
  outline-offset: 1px;
}

.day-card--fixed {
  border-left-color: var(--color-fixed);
  background: var(--color-surface-alt);
}

.day-card__top {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);

  flex-wrap: wrap;

}

}

}

}

}

/* ==========================================================================

.day-board__col {

  flex-direction: column;
  gap: var(--space-2);
  min-width: 0;
  padding: var(--space-2);
  border-radius: var(--radius-md);
  background: var(--color-surface-alt);
  border: 1px solid transparent;
}

.day-board__col.is-today {
  border-color: var(--color-primary);
  background: var(--color-primary-soft);
}

.day-board__head {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: 0 var(--space-1) var(--space-1);
  border-bottom: 1px solid var(--color-border);
  flex-wrap: wrap;
}

.day-board__date {
  font-weight: 650;
  font-size: var(--font-size-sm);
}

.day-board__num {
  font-size: var(--font-size-xs);
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
}

.day-board__badge {
  font-size: var(--font-size-xs);

  border-radius: 999px;
  padding: 0 6px;
  margin-left: auto;
}

.day-board__body {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 40px;
}

.day-board__empty {
  font-size: var(--font-size-xs);
  color: var(--color-text-faint);
  padding: var(--space-2);
  text-align: center;
}

  display: flex;
  flex-direction: column;

  font: inherit;
  color: inherit;
  overflow: hidden;
}

.day-card--study { border-left-color: var(--color-study); }
.day-card--fixed { border-left-color: var(--color-fixed); background: var(--color-surface-alt); }
.day-card--rest { border-left-color: var(--color-rest); background: var(--color-rest-soft); }

  padding-top: 0;
  padding-bottom: 0;
}

.day-card.is-compact .day-card__title {
  font-size: var(--font-size-xs);
}

.day-card__top {
  display: flex;
  justify-content: space-between;
  gap: var(--space-2);
  font-size: 11px;
  color: var(--color-text-muted);
  font-variant-numeric: tabular-nums;
  flex: 0 0 auto;
}

.day-card__title {
  font-weight: 600;
  font-size: var(--font-size-sm);

  gap: 3px;
  flex: 0 0 auto;

  /* ---------- 第 5b 步：没有可排内容的明确判定 ----------
   * 不做这一步的后果很严重：用户在没有任务（或完全没有可用时间）时点"生成计划"，
   * 会看到"完整可行 + 全部 0"，误以为系统已经生成了有意义的计划。
   * 这里明确返回 invalid_input 并给出可执行的下一步建议。
   */
  /**
   * 一个任务都没有的情况：**不在这里拒绝**。
   *
   * 原因是"删除最后一个任务""完成所有任务"都是合法操作，它们同样需要走
   * 「生成候选计划 → 预览 → 确认」这条路径。真正需要"先新建任务"提示的，
   * 是"用户主动点生成计划但完全没有任务"这个场景，那属于界面层的入口判断
   * （见 planService.requestPreview），而不是引擎的职责。
   * 这里只记录一条诊断，让界面知道这份计划里没有任何可排内容。
   */
  const allTasks = state.tasks ?? [];
  if (allTasks.length === 0) {
    diagnostics.push({
      code: DIAGNOSTIC_CODE.NO_CAPACITY,
      severity: 'info',
      message: '当前没有任何学习任务，这份计划里不会包含学习时段。',
      path: 'tasks',
    });
  }

  // 说明：任务表非空但**没有可排任务**  // 说明：任务表非空但**没有可排任务**（例如全部已完成、已取消或已删除）是合法状态，
  // 此时应当照常生成一份"没有学习安排"的计划，让用户可以预览影响（例如取消任务会释放哪些时段），
  // 而不是报错拒绝。

  const orderedEntries = sortBySchedulePriority(schedulableEntries);

  const fragmentsByTask = new Map();
  const scoreByTask = new Map();
  for (const entry of orderedEntries) {
    scoreByTask.set(entry.task.id, entry.score);
    const split = splitTask(entry.task, { remainingMinutes: entry.remaining, policy });
    if (split.status === SPLIT_STATUS.OK) {
      fragmentsByTask.set(entry.task.id, [...split.fragments]);
    } else if (split.status === SPLIT_STATUS.EMPTY) {
      fragmentsByTask.set(entry.task.id, []);
    } else {
      fragmentsByTask.set(entry.task.id, [...split.fragments]);
      unscheduled.push(
        buildUnscheduled({
          task: entry.task,
          remainingMinutes: split.tailMinutes > 0 ? split.tailMinutes : entry.remaining,
          reasonCode: reasonCodeForSplitStatus(split.status),
          extra: { message: split.message },
          now,
          policy,
        }),
      );
    }
  }

  const inputHash = computeSchedulerInputHash({
    state,
    now,
    windowStart,
    windowEnd,
    engineVersion: policy.engineVersion,
    completedByTask,
  });
  const policyHash = computePolicyHash(state.settings ?? {}, policy.engineVersion);

  /* ---------- 第 6 步：放位 ---------- */
  const placementResult = placeFragments({
    days: capacityDays,
    fragmentsByTask,
    taskById,
    scoreByTask,
    policy,
    makeId: (kind, date, startMinutes, index) => deriveBlockId(kind, inputHash, date, startMinutes, index),
  });

  // 用真实的任务与片段信息重写学习块 ID，保证"同一任务同一片段 → 同一 ID"
  const placements = reassignSessionIds(placementResult.placements, fragmentsByTask, inputHash);

  /**
   * 某个任务在**它的截止时间之前**还剩下多少可用容量。
   *
   * 用途：把"排不下"的原因说准。以前一律报"七天容量不足"，
   * 但真正的原因可能是"截止 13:00 之前只剩下 60 分钟，而这个任务要 120 分钟"。
   */
  function capacityBeforeDeadline(task) {
    const minutes = parseDeadlineMinutes(task?.deadlineTime);
    if (!task?.deadlineDate || minutes === null) return null;
    const deadlineAbsolute = absoluteMinutes({ date: task.deadlineDate, minutes });
    let total = 0;
    for (const day of capacityDays) {
      const dayStart = absoluteMinutes({ date: day.date, minutes: 0 });
      const latest = deadlineAbsolute - dayStart;
      if (latest <= 0) continue;
      for (const window of day.freeWindows) {
        const end = Math.min(window.endMinutes, latest);
        if (end > window.startMinutes) total += end - window.startMinutes;
      }
    }
    return total;
  }

  /** 给"放不下"的任务挑一个最准确的原因 */
  function refineReason(task, remaining, fallback) {
    const beforeDeadline = capacityBeforeDeadline(task);
    if (beforeDeadline !== null && beforeDeadline < remaining) {
      return UNSCHEDULED_REASON.DEADLINE_TOO_CLOSE;
    }
    return fallback;
  }

  /* ---------- 第 6b 步：无法放置的片段 ---------- */
  const placedByTask = countPlacedMinutes(placements);
  for (const entry of orderedEntries) {
    const planned = remainingByTask.get(entry.task.id) ?? 0;
    const placed = placedByTask.get(entry.task.id) ?? 0;
    if (placed >= planned) continue;
    const already = unscheduled.find((item) => item.taskId === entry.task.id);
    if (already) {
      // 原因可能被更早的路径写成泛化描述，这里用截止时间口径纠正一次
      already.reasonCode = refineReason(entry.task, planned, already.reasonCode);
      already.reasonText = REASON_TEXT[already.reasonCode] ?? already.reasonText;
      continue;
    }
    const missing = planned - placed;
    // 不可拆分任务放不下的原因要准确：是"没有足够长的连续空档"，而不是"总容量不足"
    const longestSlot = capacityDays.reduce((max, day) => Math.max(max, longestFreeSlot(day.freeWindows)), 0);
    const isAtomic = entry.task.splittable === false;
    const atomicNoSlot = isAtomic && longestSlot < entry.task.plannedMinutes;
    // 原因要准确：如果"截止前剩余时间"本身就不够，就不能笼统地说"七天容量不足"
    const baseReason = atomicNoSlot ? UNSCHEDULED_REASON.NON_SPLITTABLE_NO_SLOT : UNSCHEDULED_REASON.INSUFFICIENT_CAPACITY;
    const reasonCode = refineReason(entry.task, planned, baseReason);
    unscheduled.push(
      buildUnscheduled({
        task: entry.task,
        remainingMinutes: missing,
        reasonCode,
        extra: { gapMinutes: missing, longestFreeSlot: longestSlot, totalSchedulable },
      }),
    );
  }

  /* ---------- 第 7 步：局部优化 ---------- */
  const optimized = optimizePlacements({
    placements,
    policy,
    // 占用集合 = 保留时段（锁定/进行中/已完成）+ 固定活动。
    // 只考虑保留时段会让"向前压缩"把片段挪进上课时间，从而产生 H1 违规。
    occupiedSpans: [...reservedSpans, ...fixedSpans],
    studyWindows: state.settings?.studyWindows ?? {},
    /**
     * 局部优化必须使用**裁剪后的**每日可用窗口。
     *
     * capacityDays 里的 windows 已经扣掉了"规划起点之前"的时间；
     * 如果这里退回用原始的按星期窗口，优化器就会把片段"向前压缩"到规划起点之前
     * （例如现在 20:30、起点 21:00，却把学习排到 16:00）。
     * 这是"不生成过去时段"这条规则在优化阶段被绕过的真实原因。
     */
    windowsByDate: new Map(capacityDays.map((day) => [day.date, day.windows])),
    taskById,
    passes: input.optimizationPasses ?? policy.optimizationPasses,
  });

  /* ---------- 第 8 步：组装时间轴块 ---------- */
  // 只把 kind='study' 的放置结果转成学习块。
  // 早期版本直接 map 整个 optimized 数组，导致休息块被当成学习块统计（时长翻倍、并触发 H2 误报）。
  const studyBlocks = optimized
    .filter((placement) => placement.kind === 'study')
    .map((placement) => ({
    id: placement.id,
    kind: BLOCK_KIND.STUDY,
    date: placement.date,
    startMinutes: placement.startMinutes,
    endMinutes: placement.endMinutes,
    refId: placement.id,
    taskId: placement.taskId,
    subject: placement.subject,
    label: placement.label,
    locked: false,
    derived: false,
    meta: { undersized: placement.undersized, reasons: placement.reasons, plannedMinutes: placement.plannedMinutes },
  }));

  const reservedBlocks = [...reservedSessions, ...outOfWindowReserved].map((session) => ({
    id: `blk_reserved_${session.id}`,
    kind: BLOCK_KIND.STUDY,
    date: session.date,
    startMinutes: session.startMinutes,
    endMinutes: session.endMinutes,
    refId: session.id,
    taskId: session.taskId,
    subject: taskById.get(session.taskId)?.subject ?? null,
    label: taskById.get(session.taskId)?.title ?? '学习时段',
    locked: Boolean(session.locked),
    derived: false,
    // 历史块：仍出现在计划里（统计/回顾需要），但不参与冲突与排程校验
    history: session.state === SESSION_STATE.COMPLETED || session.state === SESSION_STATE.CANCELLED,
    meta: { state: session.state, plannedMinutes: session.plannedMinutes, reserved: true, history: session.state === SESSION_STATE.COMPLETED || session.state === SESSION_STATE.CANCELLED },
  }));

  const fixedBlocks = fixedSpans.map((span) => ({
    id: `blk_fixed_${span.activityId}_${span.date}_${span.startMinutes}`,
    kind: BLOCK_KIND.FIXED,
    date: span.date,
    startMinutes: span.startMinutes,
    endMinutes: span.endMinutes,
    refId: span.activityId,
    label: span.title ?? '固定活动',
    locked: false,
    derived: false,
    meta: { type: span.type },
  }));

  const restBlocks = optimized
    .filter((placement) => placement.kind === 'rest')
    .map((placement) => ({
      id: placement.id,
      kind: BLOCK_KIND.REST,
      date: placement.date,
      startMinutes: placement.startMinutes,
      endMinutes: placement.endMinutes,
      refId: null,
      label: '休息',
      locked: false,
      derived: true,
      meta: { plannedMinutes: placement.plannedMinutes },
    }));

  // 缓冲时间功能已移除：不再生成任何缓冲时段（也不会再因为缓冲改变任务时段）
  const bufferBlocks = [];

  const blocks = [...studyBlocks, ...reservedBlocks, ...fixedBlocks, ...restBlocks, ...bufferBlocks].sort(compareBlocks);

  /* ---------- 第 9 步：硬约束校验 ---------- */
  const validation = validatePlanConstraints({
    plan: { blocks, sessionIds: blocks.filter((b) => b.kind === BLOCK_KIND.STUDY && b.refId).map((b) => b.refId) },
    tasks: state.tasks ?? [],
    sessions: state.sessions ?? [],
    fixedActivities: state.fixedActivities ?? [],
    settings: state.settings ?? {},
    now,
    policy,
    plannedMinutesByTask: remainingByTask,
    placedMinutesByTask: countPlacedMinutes(optimized),
  });

  for (const violation of validation.violations) {
    diagnostics.push({
      code: DIAGNOSTIC_CODE.RESERVED_BLOCK_OVERLAP,
      severity: 'error',
      constraint: violation.constraint,
      message: violation.message,
      relatedIds: violation.relatedIds,
    });
  }
  for (const warn of validation.warnings) {
    diagnostics.push({
      code: warn.constraint === CONSTRAINT.H4 ? DIAGNOSTIC_CODE.DEADLINE_LATE : DIAGNOSTIC_CODE.INPUT_WARNING,
      severity: 'warning',
      constraint: warn.constraint,
      message: warn.message,
      relatedIds: warn.relatedIds,
    });
  }

  if (!validation.ok) {
    // 硬约束被违反：绝不把这份计划当成可用结果交付给用户确认。
    // 这里把 blocks 一并带出，纯粹是为了让测试与诊断能直接看到"到底排成了什么样"。
    return {
      ok: false,
      status: PLAN_STATUS.INVALID_INPUT,
      reason: 'constraint_violation',
      blocksForDiagnostics: blocks,
      violations: validation.violations,
      diagnostics,
      unscheduled,
      inputHash,
      policyHash,
      taskById,
      policy,
      now,
      windowStart,
      windowEnd,
      windowDays,
      capacityDays,
      issues: validation.violations.map((violation) =>
        error(VALIDATION_CODES.ENTITY_OVERLAP, `engine.${violation.constraint}`, violation.message, violation.details),
      ),
    };
  }

  /* ---------- 第 10 步：可行性状态、风险与差异 ---------- */
  const placedTotal = placements.reduce((sum, placement) => sum + (placement.endMinutes - placement.startMinutes), 0);

  // 未安排的工作量（去掉已经排入的部分之后重新核账，保证报告的数字与计划一致）
  const finalUnscheduled = reconcileUnscheduled({
    unscheduled,
    remainingByTask,
    placements,
    taskById,
    now,
    policy,
  });

  const remainingAfter = [...remainingByTask.values()].reduce((sum, value) => sum + value, 0);
  const placedForActiveTasks = placements.reduce((sum, placement) => sum + (placement.endMinutes - placement.startMinutes), 0);

  let status = PLAN_STATUS.FEASIBLE;
  if (finalUnscheduled.length > 0) {
    status = placedForActiveTasks > 0 ? PLAN_STATUS.PARTIALLY_FEASIBLE : PLAN_STATUS.INFEASIBLE;
  }

  const overloadMinutes = computeOverload({ remainingByTask, capacityDays, placements });
  if (overloadMinutes > 0) {
    diagnostics.push({
      code: DIAGNOSTIC_CODE.OVERLOAD,
      severity: 'warning',
      message: `任务总需求超出七天窗口内的可用容量约 ${overloadMinutes} 分钟。系统不会通过取消机动缓冲来掩盖这个问题，请考虑延长学习时间或调整截止时间。`,
      details: { overloadMinutes },
    });
  }

  const days = buildDayMetrics({ capacityDays, blocks, placements, windowStart, windowEnd });

  const bufferReservedMinutes = bufferBlocks.reduce((sum, block) => sum + (block.endMinutes - block.startMinutes), 0);
  const restMinutes = restBlocks.reduce((sum, block) => sum + (block.endMinutes - block.startMinutes), 0);
  const studyMinutes = studyBlocks.reduce((sum, block) => sum + (block.endMinutes - block.startMinutes), 0);
  const reservedMinutesTotal = reservedBlocks.reduce((sum, block) => sum + (block.endMinutes - block.startMinutes), 0);

  const plan = {
    planId: input.planId ?? null,
    version: input.baseVersion ?? ((input.existingPlan?.version ?? 0) + 1),
    status,
    generatedAt: null, // 由调用方（服务层）填入真实时间：引擎保持纯函数，不读时钟
    windowStart,
    windowEnd,
    engineVersion: policy.engineVersion,
    policyHash,
    inputHash,
    blocks,
    sessionIds: blocks.filter((block) => block.kind === BLOCK_KIND.STUDY && block.refId).map((block) => block.refId),
    days,
    unscheduled: finalUnscheduled,
    diagnostics,
    metrics: {
      totalStudyMinutes: studyMinutes,
      totalReservedMinutes: reservedMinutesTotal,
      // 语义：**尚未安排**的剩余工作量合计（不是所有任务的剩余量，后者含已排入的部分）
      totalTaskRemainingMinutes: finalUnscheduled.reduce((sum, item) => sum + item.remainingMinutes, 0),
      totalRemainingWorkloadMinutes: remainingAfter,
      bufferReservedMinutes,
      restMinutes,
      subjectSwitches: countSubjectSwitches(studyBlocks),
      placedMinutes: placedTotal,
      overloadMinutes,
    },
  };

  const risks = assessAllRisks({
    tasks: state.tasks ?? [],
    remainingByTask,
    blocks,
    now,
    policy: { ...policy, studyWindows: state.settings?.studyWindows ?? {}, fixedSpans, reservedSpans },
    capacityDays,
  });

  if (plan.status !== PLAN_STATUS.FEASIBLE) {
    diagnostics.push({
      code: DIAGNOSTIC_CODE.OVERLOAD,
      severity: 'warning',
      message: `当前计划状态：${plan.status === PLAN_STATUS.INFEASIBLE ? '不可行' : '部分可行'}（${finalUnscheduled.length} 个任务未完全安排）。`,
    });
  }

  const diff = diffPlans(input.existingPlan ?? null, plan, { taskById });

  return {
    ok: true,
    status,
    plan,
    diagnostics,
    unscheduled: finalUnscheduled,
    risks,
    diff,
    taskById,
    policy,
    now,
    windowStart,
    windowEnd,
    windowDays,
    capacityDays,
    inputHash,
    policyHash,
    scoredEntries: orderedEntries.map((entry) => ({ taskId: entry.task.id, ...entry.score })),
    stats: {
      planned: remainingAfter,
      placed: placedForActiveTasks,
      schedulableMinutes: totalSchedulable,
      overloadMinutes,
    },
  };
}

/**
 * 计算一次排程的输入指纹（引擎内部与业务层共用同一个实现）。
 *
 * 抽出来的原因：服务层在"应用预览"时必须重新计算**当前状态**的指纹来检测预览过期。
 * 如果服务层自己再写一遍指纹逻辑，两边稍有差别（例如少算一个字段）就会出现
 * "数据明明变了、预览却还能应用"的漏洞。共用同一个函数可以彻底避免这种漂移。
 *
 * @param {object} params
 * @param {object} params.state 应用状态
 * @param {{date: string, minutes: number}} params.now
 * @param {string} params.windowStart
 * @param {string} params.windowEnd
 * @param {string} params.engineVersion
 * @param {Record<string, number>} [params.completedByTask] 每个任务的已完成分钟数
 */
function computeSchedulerInputHash({ state, now, windowStart, windowEnd, engineVersion, completedByTask }) {
  return computeInputHash({
    engineVersion,
    policyHash: computePolicyHash(state.settings ?? {}, engineVersion),
    nowDate: now.date,
    windowStart,
    windowEnd,
    settings: state.settings ?? {},
    tasks: state.tasks ?? [],
    sessions: state.sessions ?? [],
    fixedActivities: state.fixedActivities ?? [],
    completedMinutesByTask: completedByTask ?? {},
  });
}

/* ------------------------------------------------------------------ *
 * 辅助：输入非法
 * ------------------------------------------------------------------ */

function invalidResult({ now, windowStart, windowEnd, windowDays, policy, issues, state, baseVersion, existingPlan, taskById }) {
  return {
    ok: false,
    status: PLAN_STATUS.INVALID_INPUT,
    reason: 'invalid_input',
    issues,
    violations: [],
    diagnostics: issues.map((issue) => ({
      code: issue.code,
      severity: 'error',
      message: issue.message,
      path: issue.path,
    })),
    unscheduled: [],
    risks: [],
    diff: diffPlans(existingPlan ?? null, null, { taskById: taskById ?? new Map() }),
    policy,
    now,
    windowStart,
    windowEnd,
    windowDays,
    capacityDays: [],
    inputHash: null,
    policyHash: null,
    state,
    baseVersion,
  };
}

/* ------------------------------------------------------------------ *
 * 辅助：依赖门控
 * ------------------------------------------------------------------ */

/**
 * 找出被依赖阻断的任务。
 *
 * 规则（对应 H7 与需求"前置未完成不得提前执行"）：
 * - 前置任务被取消/删除 → 永远无法满足（DEPENDENCY_UNREACHABLE）
 * - 前置任务仍有剩余工作量、但本次窗口内排不下 → 本任务也无法可靠地"接在它之后"（BLOCKED_BY_DEPENDENCY）
 * - 前置任务可安排 → 不阻断（先后顺序由放位阶段的依赖检查保证）
 */
function collectDependencyBlocked(tasks, taskById, remainingByTask) {
  const blocked = new Map();
  const taskSet = new Set(tasks.map((task) => task.id));

  for (const task of tasks) {
    for (const dependencyId of task.dependsOn ?? []) {
      const dependency = taskById.get(dependencyId);
      if (!dependency) continue;
      if (dependency.status === 'completed') continue; // 前置任务已完成，不构阻断

      if (dependency.status === 'cancelled' || dependency.status === 'deleted') {
        blocked.set(task.id, {
          reasonCode: UNSCHEDULED_REASON.DEPENDENCY_UNREACHABLE,
          extra: { dependencyId, dependencyTitle: dependency.title },
        });
        break;
      }
      if (!taskSet.has(dependencyId)) {
        // 前置任务本身不在可排程集合里（例如已取消）→ 同样无法满足
        blocked.set(task.id, {
          reasonCode: UNSCHEDULED_REASON.DEPENDENCY_UNREACHABLE,
          extra: { dependencyId, dependencyTitle: dependency.title },
        });
        break;
      }
      if ((remainingByTask.get(dependencyId) ?? 0) <= 0) continue; // 已完成，不阻断
    }
  }
  return blocked;
}

/* ------------------------------------------------------------------ *
 * 辅助：未安排原因
 * ------------------------------------------------------------------ */

function reasonCodeForSplitStatus(status) {
  switch (status) {
    case SPLIT_STATUS.ATOMIC_TOO_LONG:
      return UNSCHEDULED_REASON.NON_SPLITTABLE_NO_SLOT;
    case SPLIT_STATUS.UNSPLITTABLE_TAIL:
      return UNSCHEDULED_REASON.TAIL_TOO_SMALL;
    case SPLIT_STATUS.TOO_MANY_FRAGMENTS:
      return UNSCHEDULED_REASON.TAIL_TOO_SMALL;
    default:
      return UNSCHEDULED_REASON.INSUFFICIENT_CAPACITY;
  }
}

function buildUnscheduled({ task, remainingMinutes, reasonCode, extra = {} }) {
  return {
    taskId: task.id,
    taskTitle: task.title,
    subject: task.subject,
    remainingMinutes,
    gapMinutes: remainingMinutes,
    reasonCode,
    reasonText: extra.message ?? describeReason(reasonCode),
    details: { ...extra, deadlineDate: task.deadlineDate, deadlineTime: task.deadlineTime },
    suggestions: suggestFor(reasonCode),
  };
}

function describeReason(reasonCode) {
  const texts = {
    [UNSCHEDULED_REASON.INSUFFICIENT_CAPACITY]: '七天窗口内的可用学习容量不足，放不下剩余的全部工作量。',
    [UNSCHEDULED_REASON.TAIL_TOO_SMALL]: '剩余的尾部时长小于该任务的最短学习时段，无法作为一个合法时段安排。',
    [UNSCHEDULED_REASON.BLOCKED_BY_DEPENDENCY]: '前置任务尚未完成，因此不能提前安排。',
    [UNSCHEDULED_REASON.DEPENDENCY_UNREACHABLE]: '前置任务已被取消或删除，该任务永远无法满足依赖条件。',
    [UNSCHEDULED_REASON.NON_SPLITTABLE_NO_SLOT]: '该任务不可拆分，但窗口内没有足够长的连续空闲时段一次放下。',
    [UNSCHEDULED_REASON.DEADLINE_PASSED]: '截止时间已经过去，安排也无法按时完成。',
    [UNSCHEDULED_REASON.DEADLINE_TOO_CLOSE]: '截止时间之前剩余的可用时间放不下这个任务（不会排到截止时间之后）。',
    [UNSCHEDULED_REASON.WINDOW_TOO_NARROW]: '允许学习的时间窗口为空或过窄。',
    [UNSCHEDULED_REASON.DAILY_CAP_REACHED]: '已触达每日学习上限或每日片段数上限。',
    [UNSCHEDULED_REASON.OVERLOADED]: '所有任务的剩余工作量之和超过了窗口内的可用容量。',
  };

  if (!idFactory || typeof idFactory.next !== 'function') throw new TypeError('createPlanService 需要 idFactory');

  const nowIso = () => app.clock();
  const historyLimit = app.planHistoryLimit ?? PLAN_HISTORY_LIMIT;

  /** 读取"产生当前正式计划的那次变更"的摘要，用于版本历史条目 */
  function lastMutationSummary(fallbackPlan) {
    const fromMeta = app.getState()?.meta?.lastPlanMutation?.summary;
    if (typeof fromMeta === 'string' && fromMeta.length > 0) return fromMeta;
    return fallbackPlan?.generatedAt ? '（更早的变更）' : null;
  }

  function getOfficialPlan() {
    return app.getState()?.officialPlan ?? null;
  }

  function getHistory() {
    return app.getState()?.planHistory ?? [];
  }

  function getPendingPreview() {
    return app.getState()?.pendingPreview ?? null;
  }

  /**
   * 生成候选计划对象（由块集合与每日容量明细构造）。
   * 引擎会调用本函数把结果包装成完整的 SchedulePlan。
   */
  function buildCandidatePlan({
    blocks,
    windowStart,
    days = 7,
    status = PLAN_STATUS.FEASIBLE,
    unscheduled = [],
    diagnostics = [],
    dayCapacities = [],
    inputHash = null,
    policyHash = null,
    engineVersion,
    version,
  }) {
    const window = planWindow(windowStart, days);
    const capacityByDate = new Map(dayCapacities.map((c) => [c.date, c]));
    const blockStats = aggregateBlocksByDate(blocks);

    const dayList = [];
    for (let i = 0; i < days; i += 1) {
      const date = addDays(window.startDate, i);
      const capacity = capacityByDate.get(date);
      const stats = blockStats.get(date) ?? { studyMinutes: 0, restMinutes: 0, bufferMinutes: 0, sessionCount: 0 };
      const base = capacity ? { ...emptyDayMetrics(date), ...capacity } : emptyDayMetrics(date);
      dayList.push({
        ...base,
        date,
        weekday: weekday(date),
        studyMinutes: stats.studyMinutes,
        restMinutes: stats.restMinutes,
        bufferMinutes: stats.bufferMinutes,
        sessionCount: stats.sessionCount,
        overloadMinutes: Math.max(0, (capacity?.overloadMinutes ?? 0)),
      });
    }

    const metrics = computePlanMetrics(blocks);
    metrics.totalTaskRemainingMinutes = unscheduled.reduce((sum, u) => sum + (u.remainingMinutes ?? 0), 0);

    return {
      planId: idFactory.next('plan'),
      version: Number.isInteger(version) ? version : (getOfficialPlan()?.version ?? 0) + 1,
      status,
      generatedAt: nowIso(),
      windowStart: window.startDate,
      windowEnd: window.endDate,
      engineVersion: engineVersion ?? 'engine@0.1.0',
      policyHash,
      inputHash,
      blocks,
      sessionIds: blocks.filter((b) => b.kind === BLOCK_KIND.STUDY && b.refId).map((b) => b.refId),
      days: dayList,
      unscheduled,
      diagnostics,
      metrics,
    };
  }

  /** 把块按日期聚合为统计（供 buildCandidatePlan 与 UI 预览使用） */
  function aggregateBlocksByDate(blocks) {
    const byDate = groupBlocksByDate(blocks);
    const out = new Map();
    for (const [date, list] of byDate) {
      const stats = { studyMinutes: 0, restMinutes: 0, bufferMinutes: 0, sessionCount: 0 };
      for (const block of list) {
        const length = block.endMinutes - block.startMinutes;
        if (block.kind === BLOCK_KIND.STUDY) {
          stats.studyMinutes += length;
          stats.sessionCount += 1;
        } else if (block.kind === BLOCK_KIND.REST) {
          stats.restMinutes += length;
        } else if (block.kind === BLOCK_KIND.BUFFER) {
          stats.bufferMinutes += length;
        }
      }
      out.set(date, stats);
    }
    return out;
  }

  /**
   * 应用一份计划为正式计划（候选计划 → 正式计划）。
   *
   * @param {object} candidate 已构造好的 SchedulePlan
   * @param {object} [options]
   * @param {string} options.changeSummary 变更摘要（会显示在版本历史中）
   * @param {string} [options.trigger] 触发来源（manual / preview-confirm / window-roll ...）
   * @param {number|null} [options.expectedBaseVersion] 若提供，则校验正式计划版本未被改动
   * @param {string|null} [options.expectedInputHash] 若提供，则校验输入指纹未变化（预览过期检测）
   */
  function applyPlan(candidate, options = {}) {
    const { changeSummary = '应用计划', trigger = 'manual', expectedBaseVersion = null, expectedInputHash = null } = options;
    const current = getOfficialPlan();

    // 1) 预览过期检测：基础版本或输入指纹变化时，拒绝应用，绝不覆盖新数据
    if (expectedBaseVersion !== null && current && current.version !== expectedBaseVersion) {
      return {
        ok: false,
        code: 'stale_preview',
        issues: [
          error(
            C.ENTITY_OVERLAP,
            'plan.version',
            `预览已过期：它基于版本 v${expectedBaseVersion}，而当前正式计划是 v${current.version}。请重新生成预览后再确认。`,
            { expectedBaseVersion, actualVersion: current.version },
          ),
        ],
      };
    }
    if (expectedInputHash !== null && current && current.inputHash !== null && current.inputHash !== expectedInputHash) {
      return {
        ok: false,
        code: 'stale_preview',
        issues: [
          error(C.ENTITY_OVERLAP, 'plan.inputHash', '预览已过期：生成预览后任务或设置发生了变化。请重新生成预览。', {
            expectedInputHash,
            actualInputHash: current.inputHash,
          }),
        ],
      };
    }
    if (expectedBaseVersion !== null && !current && expectedBaseVersion !== 0) {
      return {
        ok: false,
        code: 'stale_preview',
        issues: [error(C.REQUIRED, 'plan', '当前没有正式计划，但预览声称基于某个版本。请重新生成预览。', { expectedBaseVersion })],
      };
    }

    // 2) 结构校验（应用前的最后一道防线）
    const validation = validatePlan(candidate, 'candidate');
    if (!validation.ok) return { ok: false, issues: validation.issues };

    // 3) 硬约束保护：已完成的时段必须原样保留（H9）
    const sessions = app.getState().sessions ?? [];
    const completed = sessions.filter((s) => s.state === SESSION_STATE.COMPLETED);
    const planSessionIds = new Set(candidate.sessionIds ?? []);
    const missingCompleted = completed.filter((s) => !planSessionIds.has(s.id));
    if (missingCompleted.length > 0) {
      return {
        ok: false,
        issues: [
          error(
            C.ENTITY_DANGLING_REF,
            'plan.sessionIds',
            `候选计划缺少 ${missingCompleted.length} 个已完成的学习时段。已完成记录必须始终保留在计划中。`,
            { sessionIds: missingCompleted.map((s) => s.id) },
          ),
        ],
      };
    }

    // 4) 写入：先追加历史快照，再替换正式计划（同一事务内完成）
    //
    // 快照记录的是"被替换掉的那份计划"，因此它的事件摘要应当来自**产生该计划的**那次变更
    // （meta.lastPlanMutation），而不是本次变更——否则版本历史里每个条目的说明都会错位成后一次操作。
    const snapshot = current
      ? createPlanSnapshot({
          plan: current,
          nowIso: nowIso(),
          changeSummary: lastMutationSummary(current) ?? '（未记录变更说明）',
          trigger,
        })
      : null;

    const commitResult = app.commit(
      (state) => {
        const history = snapshot ? [snapshot, ...state.planHistory] : [...state.planHistory];
        return {
          ...state,
          officialPlan: { ...candidate, version: candidate.version },
          planHistory: history.slice(0, historyLimit),
          pendingPreview: null,
          meta: { ...state.meta, lastPlanMutation: { at: nowIso(), summary: changeSummary, trigger } },
        };
      },
      { reason: 'plan-apply' },
    );
    if (!commitResult.ok) return { ok: false, error: commitResult.error };

    return { ok: true, plan: getOfficialPlan(), snapshotCreated: Boolean(snapshot) };
  }

  /**
   * 撤销上一次应用：恢复上一个历史快照。
   *
   * 注意两点有意为之的行为：
   * 1. 版本号**继续递增**，不重用回退的数字。否则"v7 撤回到 v6，然后又改了数据变成 v7"
   *    会让版本号指向两份不同的计划，破坏"预览过期检测"与用户对版本号的信赖。
   * 2. 撤销被拒绝的情形：本次撤销会覆盖用户新完成的学习记录时（即快照之后又有新的已完成时段）。
   */
  function undoLastApply() {
    const current = getOfficialPlan();
    const [latest, ...rest] = getHistory();
    if (!current || !latest) {
      return { ok: false, issues: [error(C.REQUIRED, 'planHistory', '没有可以撤销的计划版本。', {})] };
    }

    const sessions = app.getState().sessions ?? [];
    const restoredIds = new Set(latest.plan?.sessionIds ?? []);
    const newlyCompleted = sessions.filter((s) => s.state === SESSION_STATE.COMPLETED && !restoredIds.has(s.id));
    if (newlyCompleted.length > 0) {
      return {
        ok: false,
        issues: [
          error(
            C.ENTITY_DANGLING_REF,
            'planHistory',
            `无法撤销：撤销后会让 ${newlyCompleted.length} 个已完成的学习记录从计划中消失。请先处理这些记录（或不要撤销）。`,
            { sessionIds: newlyCompleted.map((s) => s.id) },
          ),
        ],
      };
    }

    const restored = { ...latest.plan, version: current.version + 1, generatedAt: nowIso() };
    const commitResult = app.commit(
      (state) => ({
        ...state,
        officialPlan: restored,
        planHistory: rest,
        pendingPreview: null,
        meta: { ...state.meta, lastPlanMutation: { at: nowIso(), summary: `撤销到 v${latest.version}`, trigger: 'undo' } },
      }),
      { reason: 'plan-undo' },
    );
    if (!commitResult.ok) return { ok: false, error: commitResult.error };

    return { ok: true, plan: restored, undoneFrom: current.version, restoredFrom: latest.version };
  }

  /** 版本历史视图（不含完整快照，减小内存与渲染开销） */
  function listVersions() {
    const current = getOfficialPlan();
    return [
      ...(current ? [{ version: current.version, createdAt: current.generatedAt, summary: '当前正式计划', trigger: 'current', current: true }] : []),
      ...getHistory().map((h) => ({
        version: h.version,
        createdAt: h.createdAt,
        summary: h.changeSummary,
        trigger: h.trigger,
        current: false,
      })),
    ];
  }

  /** 计划尚未建立时，给出一个空的展示占位（不是"假计划"，所有统计为 0） */
  function ensureDisplayPlan(windowStart) {
    const current = getOfficialPlan();
    if (current) return current;
    return createEmptyPlan({
      planId: idFactory.next('plan'),
      version: 0,
      windowStart,
      nowIso: nowIso(),
    });
  }

  /** 删除本地历史版本（用于释放存储空间；不影响当前正式计划与任何时段） */
  function clearHistory() {
    const commitResult = app.commit((state) => ({ ...state, planHistory: [] }), { reason: 'plan-history-clear' });
    if (!commitResult.ok) return { ok: false, error: commitResult.error };
    return { ok: true };
  }

  /**
   * 判断某个时段是否受保护（不可被自动排程改动）。
   * 供界面显示锁定图标、以及引擎构建保留集合时使用。
   */
  function isSessionProtected(session) {
    return isLockedForScheduling(session);
  }

  /** 计划是否包含未安排任务（界面用于提示"部分可行"的原因） */
  function unscheduledSummary(plan) {
    const list = plan?.unscheduled ?? [];
    return {
      count: list.length,
      totalMinutes: list.reduce((sum, u) => sum + (u.remainingMinutes ?? 0), 0),
      reasons: [...new Set(list.map((u) => u.reasonCode))],
    };
  }

  /**
   * 生成候选计划与差异预览（**不修改任何已保存的数据**）。
   *
   * @param {object} input
   * @param {{date: string, minutes: number}} input.now 当前本地墙上时间（由调用方注入，保证可测）
   * @param {Map<string, object>} [input.draft] 由 services 层构造的"变更后的草稿状态"
   *   （任务/设置编辑会传入；不传则使用当前状态）
   * @param {string} [input.changeSummary] 变更摘要（写入版本历史）
   * @param {string} [input.trigger] 触发来源
   * @returns {{ok: boolean, preview?: object, issues?: object[], code?: string, result?: object}}
   */
  /**
   * 把界面传来的开始时间规整成引擎要的形状。
   *
   * 接受：`{ date, minutes }` 或 `'HH:mm'` 字符串（界面用的是 time 输入框）。
   * 不合法时返回 null，让引擎走默认规则——绝不把非法值塞进排程。
   */
  function normalizeStartAt(startAt) {
    if (!startAt) return null;
    if (typeof startAt === 'string') {
      const match = /^(\d{2}):(\d{2})$/.exec(startAt.trim());
      if (!match) return null;
      const minutes = Number(match[1]) * 60 + Number(match[2]);
      return minutes >= 0 && minutes <= 1440 ? { minutes } : null;
    }
    if (typeof startAt === 'object' && Number.isInteger(startAt.minutes)) return startAt;
    return null;
  }

  function requestPreview(input = {}) {
    // "现在"必须显式传入（引擎是纯函数）。未传时从状态容器的时钟推导，便于界面直接调用。
    const now = input.now ?? wallTimeFromDateObject(new Date(app.clock()));
    const baseState = app.getState();

    /**
     * 变更来源有两种：
     * - `ops`：数据变更描述（界面统一走这条路），在内存里应用成草稿状态；
     * - `draft`：调用方直接给出完整草稿状态（引擎测试与内部调用使用）。
     * 无论哪种，**都不会修改已保存的数据**。
     */
    const ops = input.ops ?? [];
    let state = input.draft ?? baseState;
    let windowStart = input.windowStart ?? now.date;
    let draftCreatedTaskIds = [];
    if (ops.length > 0) {
      const baseTaskIds = new Set((baseState.tasks ?? []).map((task) => task.id));
      const applied = applyDraftOps(baseState, ops, { idFactory, nowIso: nowIso() });
      if (!applied.ok) {
        return { ok: false, code: 'invalid_draft', status: 'invalid_input', issues: applied.issues ?? [], diagnostics: [] };
      }
      state = applied.state;
      // 记录草稿阶段"新建任务"的 ID：确认应用时会用同一顺序的新 ID 覆盖它们
      draftCreatedTaskIds = (state.tasks ?? []).filter((task) => !baseTaskIds.has(task.id)).map((task) => task.id);
      const shift = ops.find((op) => op.kind === 'window.shift');
      if (shift?.windowStart) windowStart = shift.windowStart;
    }

    /**
     * "先新建任务"的引导放在这里，而不是引擎里。
     *
     * 只有**用户主动生成计划**（没有携带任何数据变更）且一个任务都没有时才拦截；
     * 删除任务这类携带变更的操作必须照常生成候选计划，
     * 否则会出现"删不掉最后一个任务"的死角。
     */
    if (ops.length === 0 && (state.tasks ?? []).length === 0) {
      return {
        ok: false,
        code: 'no_tasks',
        status: 'invalid_input',
        issues: [
          error(
            C.REQUIRED,
            'tasks',
            '还没有可以安排的学习任务。请先到「学习任务」页新建任务（填好预计用时与截止日期），再来生成计划。',
            {},
          ),
        ],
        diagnostics: [],
      };
    }

    const current = getOfficialPlan();
    const baseVersion = current?.version ?? 0;
    // 基准指纹取**当前状态**的指纹（而不是旧计划里存的指纹）：
    // 这样"预览生成后数据又被改动"就能被精确检测出来。
    const baseInputHash = computeLiveInputHash(app.getState(), now);

    const windowDays = input.windowDays ?? 7;
    const engineResult = runScheduler({
      state,
      now,
      windowStart,
      windowDays,
      existingPlan: current,
      baseVersion: baseVersion + 1,
      planId: idFactory.next('plan'),
      /**
       * 本次规划的搜索起点（可选）。
       * 不传时引擎自己按"当前时刻之后的下一个整点"推导，
       * 因此界面只需要在用户**显式填写**时才传值。
       */
      startAt: normalizeStartAt(input.startAt),
    });

    if (!engineResult.ok) {
      return {
        ok: false,
        code: engineResult.reason ?? 'engine_failed',
        status: engineResult.status,
        issues: engineResult.issues ?? [],
        diagnostics: engineResult.diagnostics ?? [],
        unscheduled: engineResult.unscheduled ?? [],
        result: engineResult,
      };
    }

    // 对齐会话身份后再计算差异与快照，保证"没变的安排"在各处都表现为没变
    const alignedPlan = alignCandidateSessionIds(engineResult.plan, state);
    const candidate = { ...alignedPlan, generatedAt: nowIso() };
    const summary = input.changeSummary ?? describeDraftOps(ops);
    const preview = {
      previewId: idFactory.next('preview'),
      baseVersion,
      baseInputHash,
      candidate,
      diff: diffPlans(current, candidate, { taskById: engineResult.taskById ?? buildTaskMap(state) }),
      risks: engineResult.risks,
      diagnostics: engineResult.diagnostics,
      unscheduled: engineResult.unscheduled,
      createdAt: nowIso(),
      changeSummary: summary,
      trigger: input.trigger ?? 'preview',
      /**
       * 应用时需要一并写入的数据变更（确认之前一直只是草稿）。
       *
       * 注意：这里**不预先构造** sessionPlan。
       * 原因：草稿里新任务使用的是"临时实体"（在内存里创建、ID 由同一批操作生成），
       * 与确认时真正写入的任务之间必须保持一致；因此会话快照必须在
       * **重放 ops 之后**、基于最终状态构造（见 applyPreview）。
       */
      ops,
      /** 草稿阶段新建任务的临时 ID（应用时按同一顺序映射为真实 ID） */
      draftCreatedTaskIds,
    };

    const commitResult = app.commit((currentState) => ({ ...currentState, pendingPreview: preview }), { reason: 'preview-create' });
    if (!commitResult.ok) return { ok: false, error: commitResult.error, issues: [] };

    return { ok: true, preview, result: engineResult };
  }

  /**
   * 应用待确认的候选计划。
   *
   * 事务顺序（任一步失败都会保持现有数据不变）：
   *   1. 过期检测（基础版本 + 输入指纹）
   *   2. 结构校验 + 硬约束复检（防止预览生成后数据又变了）
   *   3. 受保护时段必须原样保留（H9 / H10）
   *   4. 一次性写入：正式计划 + 版本快照 + 时段同步
   */
  function applyPreview(input = {}) {
    const preview = getPendingPreview();
    if (!preview) {
      return { ok: false, issues: [error(C.REQUIRED, 'preview', '当前没有待确认的候选计划，无法应用。', {})] };
    }

    const current = getOfficialPlan();
    const currentVersion = current?.version ?? 0;

    if (preview.baseVersion !== currentVersion) {
      return stalePreview('基础版本已变化', preview.baseVersion, currentVersion);
    }

    // 过期检测的第二道关：**重新计算当前状态的输入指纹**，与预览记录的指纹比对。
    // 只比较 officialPlan.inputHash 是不够的——用户在预览生成后修改了任务（例如改截止时间）
    // 但还没有重新生成计划时，officialPlan 上存着的仍是旧指纹，会让过期预览"看起来有效"。
    const liveInputHash = computeLiveInputHash(app.getState(), input.now ?? null);
    if (preview.baseInputHash !== liveInputHash) {
      return stalePreview('生成预览后任务或设置发生了变化', preview.baseInputHash, liveInputHash);
    }

    const validation = validatePlan(preview.candidate, 'candidate');
    if (!validation.ok) return { ok: false, issues: validation.issues };

    const state = app.getState();

    // 重放草稿变更：这是"确认后写入"的关键一步。失败即整体放弃，绝不留半应用状态。
    const replayed = applyDraftOps(state, preview.ops ?? [], { idFactory, nowIso: nowIso() });
    if (!replayed.ok) {
      return {
        ok: false,
        code: 'draft_replay_failed',
        issues: [
          error(C.MIGRATION_FAILED, 'preview.ops', `无法应用候选计划中的数据变更：${replayed.issues?.[0]?.message ?? '未知原因'}`, {}),
          ...(replayed.issues ?? []),
        ],
      };
    }
    const nextState = replayed.state;

    // 草稿阶段新建的任务在"应用"时会再次创建（ID 与草稿不同）。
    // 候选计划里的 taskId 指向草稿 ID，必须按同一顺序改写为真实 ID，
    // 否则确认后会写出"引用不存在的任务"的时段（这是真实发生过的缺陷）。
    const remappedCandidate = remapDraftTaskIds(preview.candidate, state, nextState, preview.draftCreatedTaskIds);

    // 把候选计划的学习片段转换成 StudySession —— **必须基于重放后的状态**，
    // 否则新增任务时产生的时段会引用草稿里的临时任务 ID，导致"时段引用了不存在的任务"。
    const sessionPlan = buildSessionPlan(remappedCandidate, nextState);
    const protectedIssue = checkProtectedSessions(sessionPlan, state.sessions ?? []);
    if (protectedIssue) return { ok: false, issues: [protectedIssue] };

    const snapshot = current ? createPlanSnapshot({ plan: current, nowIso: nowIso(), changeSummary: lastMutationSummary(current), trigger: preview.trigger }) : null;

    const commitResult = app.commit(
      () => {
        const history = snapshot ? [snapshot, ...nextState.planHistory] : [...nextState.planHistory];
        return {
          ...nextState,
          sessions: sessionPlan,
          officialPlan: { ...remappedCandidate, version: remappedCandidate.version },
          planHistory: history.slice(0, historyLimit),
          pendingPreview: null,
          meta: {
            ...nextState.meta,

/** 格式化带符号的分钟差，便于在表格里一眼看出增减 */
function signed(minutes) {

  return RISK_LABELS[level] ?? level;
}
function riskPillKind(level) {
  if (level === 'on_time') return 'success';
  if (level === 'tight') return 'study';

async function handleUndo({ services, versions }) {
  const target = versions.find((v) => !v.current);
  const confirmed = await confirmDialog({
    title: '撤销上一次计划变更？',
    message: '将把正式计划恢复到上一个版本。已完成的学习记录、锁定时段都会被保留。',
    bullets: [
      target ? `将恢复到 v${target.version}（${target.summary}）` : '没有可恢复的历史版本',
      '版本号会继续递增，不会重复使用旧的版本号',
      '若撤销会导致已完成的学习记录从计划中消失，操作会被拒绝',
    ],
    confirmLabel: '确认撤销',
    confirmVariant: 'danger',
  });
  if (!confirmed) return;

  const result = services.planService.undoLastApply();
  if (!result.ok) {
    toast(result.issues?.[0]?.message ?? '撤销失败。', 'error', 7000);
    return;
  }
  toast(`已撤销：从 v${result.undoneFrom} 恢复到 v${result.restoredFrom} 的内容（新版本号 v${result.plan.version}）。`, 'success');
}

 *
 * 这里刻意不展示版本号、状态码、指纹等内部信息——用户关心的是
 * "我接下来几天的安排会变成什么样"。
 */
function describeChanges({ preview, state }) {
  const counts = preview.diff?.counts ?? {};
  const bullets = [];

  const sumMinutes = (list) => list.reduce((total, item) => total + ((item.endMinutes ?? 0) - (item.startMinutes ?? 0) || item.minutes || 0), 0);

  if (counts.added) {
    bullets.push(`新增 ${counts.added} 个学习时段${sumMinutes(preview.diff.added ?? []) > 0 ? `，共 ${formatDuration(sumMinutes(preview.diff.added))}` : ''}`);
  }
  if (counts.moved) bullets.push(`移动 ${counts.moved} 个学习时段到新的时间`);
  if (counts.resized) bullets.push(`调整 ${counts.resized} 个学习时段的时长`);
  if (counts.split) bullets.push(`把 ${counts.split} 个较长时段拆成多段`);
  if (counts.cancelled) bullets.push(`取消 ${counts.cancelled} 个不再需要的时段（记录会保留为历史）`);
  if (counts.unchanged) bullets.push(`${counts.unchanged} 个时段保持原样不变`);

  const protectedCount = (state.sessions ?? []).filter(
    (session) => session.state === 'completed' || session.locked === true || session.state === 'in_progress',
  ).length;
  if (protectedCount > 0) {
    bullets.push(`已完成的 ${(state.sessions ?? []).filter((s) => s.state === 'completed').length} 条学习记录、已锁定的 ${(state.sessions ?? []).filter((s) => s.locked && s.state !== 'completed').length} 个时段都会被完整保留`);
  }

  const unscheduled = preview.diff?.unscheduledAfter ?? [];
  if (unscheduled.length > 0) {
    bullets.push(`有 ${unscheduled.length} 个任务这次仍然无法完全安排，预览里会说明原因`);
  }
  const risks = (preview.risks ?? []).filter((risk) => risk.level === 'at_risk' || risk.level === 'impossible');
  if (risks.length > 0) {
    bullets.push(`有 ${risks.length} 个任务存在逾期风险`);
  }
  if (bullets.length === 0) bullets.push('本次没有时段变化，应用后只会生成一个新版本');
  return bullets;
}

async function handleApply({ services, preview, state, changeCount = 0 }) {
  const bullets = describeChanges({ preview, state: state ?? { sessions: [] } });

  const confirmed = await confirmDialog({
    title: changeCount > 0 ? '确认应用这份计划？' : '确认生成一个新版本？',
    message:
      changeCount > 0
        ? '应用后，未来七天的学习安排会按上面的清单更新；当前正式计划会存为一个可以撤销的历史版本。'
        : '本次没有实际变化。应用只会记录一个新版本，计划内容与现在完全相同。',
    bullets,
    confirmLabel: changeCount > 0 ? '确认应用' : '仍然应用',
    confirmVariant: 'primary',
  });
  if (!confirmed) return;

  const result = services.ui.applyPreview();
  if (!result.ok) {
    // 失败原因要说清楚，并且明确告诉用户"数据没有被改动"
    const first = result.issues?.[0];
    const isStale = result.code === 'stale_preview' || /过期|发生变化/.test(first?.message ?? '');
    toast(
      isStale
        ? '这份预览已经过期：等待确认期间数据又变了，因此没有应用。请重新点「生成计划」再确认。'
        : `${first?.message ?? '应用失败'}——正式计划与所有学习记录都没有被改动。`,
      'error',
      9000,
    );
    return;
  }

  toast(
    changeCount > 0
      ? `已应用计划：${changeCount} 项调整生效，可随时在「版本历史」撤销。`
      : '已生成新版本（内容与之前相同）。',
    'success',
    6000,
  );
  globalThis.location.hash = '#/week';
}

async function handleDiscard({ services }) {
  const result = services.ui.discardPreview();
  if (!result.ok) {
    toast(result.issues?.[0]?.message ?? '放弃失败。', 'error');
    return;
  }
  toast('已放弃候选计划，正式计划与所有学习记录没有任何变化。', 'success');
}

return { named: {renderPreview} };
})();

async function handleUndo({ services, history }) {
  const target = history[0];
  const confirmed = await confirmDialog({
    title: '撤销上一次计划变更？',
    message: '将把正式计划恢复到上一个版本。已完成的学习记录与锁定时段都会被保留。',
    bullets: [
      `将恢复到 v${target.version}（${target.changeSummary ?? '未记录变更说明'}）`,
      '版本号会继续递增，不会重复使用旧的版本号',
      '若撤销会导致已完成的学习记录从计划中消失，操作会被拒绝',
    ],
    confirmLabel: '确认撤销',
    confirmVariant: 'danger',
  });
  if (!confirmed) return;

  const result = services.ui.undoLastPlan();
  if (!result.ok) {
    toast(result.issues?.[0]?.message ?? '撤销失败。', 'error', 8000);
    return;
  }
  toast(`已撤销：内容恢复为 v${result.restoredFrom}，新版本号 v${result.plan.version}。`, 'success');
}

async function handleClear({ services, history }) {
  const confirmed = await confirmDialog({
    title: '清空版本历史？',
    message: '清空后无法再撤销到更早的计划版本。当前正式计划与所有学习时段不受影响。',
    bullets: [`将删除 ${history.length} 个历史版本快照`, '当前正式计划保持为当前版本', '任务与已完成的学习记录不受影响'],
    confirmLabel: '清空历史',
    confirmVariant: 'danger',
    requireAcknowledge: true,
  });
  if (!confirmed) return;
  const result = services.planService.clearHistory();
  if (!result.ok) return toast(result.error?.message ?? '清空失败。', 'error');
  toast('已清空版本历史。', 'success');
}

/** 统计受保护的学习记录（只读派生） */
function summarizeLearningFacts(state) {
  const sessions = state.sessions ?? [];
  const completed = sessions.filter((session) => session.state === 'completed');
  return {
    completedCount: completed.length,
    completedMinutes: completed.reduce((sum, session) => sum + (session.actualMinutes ?? session.plannedMinutes ?? 0), 0),
    lockedCount: sessions.filter((session) => session.locked && session.state !== 'completed').length,
    runningCount: sessions.filter((session) => session.state === 'in_progress').length,
  };
}

return { named: {renderVersions} };

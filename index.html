<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 默认深色：首帧就是深空，避免先闪一下白底 -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b1220" />
    <title>七天学习规划器</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><rect x='2' y='2' width='20' height='20' rx='6.5' fill='%230e1520'/><circle cx='12' cy='12' r='8.6' stroke='%236ba4f0' stroke-width='1.6'/><g stroke='%23d6ae4e' stroke-width='1.3' stroke-linecap='round'><path d='M12.00 6.40 L12.00 5.00'/><path d='M16.38 8.51 L17.47 7.64'/><path d='M17.46 13.25 L18.82 13.56'/><path d='M14.43 17.05 L15.04 18.31'/><path d='M9.57 17.05 L8.96 18.31'/><path d='M6.54 13.25 L5.18 13.56'/><path d='M7.62 8.51 L6.53 7.64'/></g><g stroke='%23eef2f8' stroke-width='1.9' stroke-linecap='round'><path d='M12 12 L12.52 9.05'/><path d='M12 12 L15.64 14.10'/></g><circle cx='12' cy='12' r='1.25' fill='%23d6ae4e'/></svg>" />
    <meta
      name="description"
      content="面向学生的七天学习时间规划工具：输入任务、截止时间、固定活动与可用时间，用确定性规则算法生成未来七天的学习计划。"
    />
    <!-- 样式按职责拆分：令牌（颜色/间距）→ 基础排版 → 组件 -->
    <link rel="stylesheet" href="./src/ui/styles/tokens.css" />
    <link rel="stylesheet" href="./src/ui/styles/base.css" />
    <link rel="stylesheet" href="./src/ui/styles/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主内容</a>

    <!-- 应用外壳由 src/ui/shell.js 渲染，这里只提供语义化挂载点 -->
    <div id="app"></div>

    <!-- 禁止脚本时给出明确说明，而不是白屏 -->
    <noscript>
      <div style="max-width: 720px; margin: 48px auto; padding: 24px; border: 1px solid #dfe3e8; border-radius: 10px; font-family: system-ui, sans-serif">
        <h1 style="font-size: 20px">需要启用 JavaScript</h1>
        <p>七天学习规划器是纯本地运行的网页应用，所有排程计算都在你的浏览器中完成，因此必须启用 JavaScript。</p>
        <p>启用后刷新本页面即可使用。你的学习数据保存在自己的浏览器里；只有在你使用右下角的「日程助手」时，系统才会把任务标题、截止时间等必要信息发送给 AI 服务用于生成回答。</p>
      </div>
    </noscript>

    <!--
      AI 中继地址（部署配置，不属于业务代码）。

      留空 = 使用同源的 /.netlify/functions/ai-chat（Netlify 部署）。
      当前中继运行在 Cloudflare Worker 上（Netlify 的生产部署额度已用尽）。

      注意：这个 origin 必须出现在 Worker 的 ALLOWED_ORIGINS 变量里，
      否则会被 Worker 以 origin_rejected 拒绝。

      放在模块脚本之前：src/main.js 是 type="module"，会被延迟执行，
      因此这里的赋值一定先于应用启动，不存在时序竞争。
    -->
    <script>
      window.__AI_ENDPOINT__ = 'https://schedule-ai-chat.jft5yd9hfp.workers.dev/';
    </script>

    <!--
      首屏主题：在模块脚本之前同步应用。

      为什么需要：默认已是深色（写在 <html data-theme>），但如果用户明确选过浅色，
      等 main.js 启动后再改会先闪一下深色。这段脚本只读偏好里的主题字段，
      不触碰任务/计划等任何业务数据，也不依赖模块加载。
    -->
    <script>
      (function () {
        try {
          var raw = window.localStorage && window.localStorage.getItem('studyPlanner:v1:preferences');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var appearance = (parsed && parsed.appearance) || {};
          var theme = appearance.theme;
          // 只有"用户明确选过"的浅色才在首帧生效，其余保持默认深色
          if (theme === 'light' && appearance.themeExplicit === true) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (error) {
          /* 偏好损坏时保持默认深色，不阻塞页面 */
        }
      })();
    </script>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
